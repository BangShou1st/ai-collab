openapi: 3.1.0
info:
  title: AI Collab API
  version: 0.1.0
  description: Local-first collaboration platform with RAG knowledge QA and AI task planning.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Invitations
  - name: Projects
  - name: Members
  - name: Milestones
  - name: Tasks
  - name: Comments
  - name: Documents
  - name: Knowledge
  - name: TaskPlans
  - name: Dashboard
  - name: Audit
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login
      description: |
        Public endpoint. Because a successful response sets the HttpOnly Refresh Cookie,
        the request must carry exactly one allowed Origin header. If Origin is absent,
        the server requires exactly one Referer and validates its origin. An untrusted,
        malformed, blank, repeated, or comma-joined source returns 403 before the
        request body reaches the controller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in; returns the Access Token and current user, and sets a new Refresh Cookie.
          headers:
            Set-Cookie:
              description: >
                ai_collab_refresh_token with Path=/api/v1/auth, HttpOnly,
                SameSite=Strict, Secure=false for local HTTP development,
                Secure=true by default in production, and Max-Age no longer
                than the server-side Refresh Token expiry.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '400':
          description: Login request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Refresh access token using HttpOnly refresh cookie
      description: |
        Public endpoint that reads the Refresh Token only from the configured
        HttpOnly Cookie; an Access Token is neither required nor read. The
        request is subject to the same mandatory Origin/Referer validation as
        login. A successful refresh strictly rotates the submitted credential
        and sets its replacement Cookie.
      responses:
        '200':
          description: Refreshed; returns only a new Access Token and rotates the Refresh Cookie.
          headers:
            Set-Cookie:
              description: Replacement ai_collab_refresh_token with the configured security attributes.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout:
    post:
      tags: [Auth]
      security: []
      summary: Revoke the current Refresh Token session and clear its Cookie
      description: |
        Public and idempotent Cookie endpoint. It requires the same mandatory
        Origin/Referer validation as login and refresh, but does not require an
        Access Token. A missing, unknown, malformed, expired, or already revoked
        Refresh Cookie still returns 200 and clears the browser Cookie. An
        unexpected infrastructure failure returns 500, while the Cookie is
        still cleared.
      responses:
        '200':
          description: Logged out or already logged out
          headers:
            Set-Cookie:
              description: >
                Clears ai_collab_refresh_token using the configured Path,
                HttpOnly, SameSite and Secure attributes with Max-Age=0.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponseEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Unexpected server or persistence failure; the Cookie is still cleared
          headers:
            Set-Cookie:
              description: Clears ai_collab_refresh_token with Max-Age=0.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /invitations/{code}:
    get:
      tags: [Invitations]
      security: []
      summary: Preview invitation
      parameters:
        - $ref: '#/components/parameters/InvitationCode'
      responses:
        '200':
          description: Invitation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreviewEnvelope'
        '410':
          $ref: '#/components/responses/Gone'
  /invitations/{code}/accept:
    post:
      tags: [Invitations]
      security: []
      summary: Accept invitation and create account
      parameters:
        - $ref: '#/components/parameters/InvitationCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '201':
          description: Account created and invitation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
  /projects:
    get:
      tags: [Projects]
      summary: List current user's projects
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListEnvelope'
    post:
      tags: [Projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Get project
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      summary: Update project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Projects]
      summary: Delete project; owner only
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Members]
      summary: List members
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListEnvelope'
  /projects/{projectId}/invitations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Members]
      summary: Create invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationEnvelope'
  /projects/{projectId}/members/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Members]
      summary: Change member role; owner only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: Role changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberEnvelope'
  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Members]
      summary: Remove member; owner only
      responses:
        '204':
          description: Removed
  /projects/{projectId}/milestones:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Milestones]
      summary: List milestones
      responses:
        '200':
          description: Milestone list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneListEnvelope'
    post:
      tags: [Milestones]
      summary: Create milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneRequest'
      responses:
        '201':
          description: Milestone created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneEnvelope'
  /projects/{projectId}/milestones/{milestoneId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/MilestoneId'
    patch:
      tags: [Milestones]
      summary: Update milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneRequest'
      responses:
        '200':
          description: Milestone updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneEnvelope'
    delete:
      tags: [Milestones]
      summary: Delete milestone
      responses:
        '204':
          description: Deleted
  /projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tasks]
      summary: List tasks
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
        - name: milestoneId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListEnvelope'
    post:
      tags: [Tasks]
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get task
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
    patch:
      tags: [Tasks]
      summary: Update task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Tasks]
      summary: Delete task
      responses:
        '204':
          description: Deleted
  /projects/{projectId}/tasks/{taskId}/dependencies:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    put:
      tags: [Tasks]
      summary: Replace task dependencies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dependencyIds]
              properties:
                dependencyIds:
                  type: array
                  maxItems: 10
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Dependencies replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}/tasks/{taskId}/comments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Comments]
      summary: List comments
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListEnvelope'
    post:
      tags: [Comments]
      summary: Add comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentEnvelope'
  /projects/{projectId}/tasks/{taskId}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/CommentId'
    patch:
      tags: [Comments]
      summary: Edit own comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200':
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentEnvelope'
    delete:
      tags: [Comments]
      summary: Delete comment
      responses:
        '204':
          description: Deleted
  /projects/{projectId}/documents:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Documents]
      summary: List documents
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListEnvelope'
    post:
      tags: [Documents]
      summary: Upload document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                displayName:
                  type: string
                  maxLength: 180
      responses:
        '202':
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentEnvelope'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /projects/{projectId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      summary: Get document
      responses:
        '200':
          description: Document detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentEnvelope'
    delete:
      tags: [Documents]
      summary: Delete document and its chunks
      responses:
        '204':
          description: Deleted
  /projects/{projectId}/documents/{documentId}/download-url:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      summary: Create five-minute presigned download URL
      responses:
        '200':
          description: Download URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrlEnvelope'
  /projects/{projectId}/documents/{documentId}/retry:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [Documents]
      summary: Retry failed processing
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentEnvelope'
  /projects/{projectId}/knowledge/sessions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Knowledge]
      summary: List own sessions
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSessionListEnvelope'
    post:
      tags: [Knowledge]
      summary: Create session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 120
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSessionEnvelope'
  /projects/{projectId}/knowledge/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Knowledge]
      summary: Get own session with messages
      responses:
        '200':
          description: Session detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSessionDetailEnvelope'
    delete:
      tags: [Knowledge]
      summary: Delete own session
      responses:
        '204':
          description: Deleted
  /projects/{projectId}/knowledge/sessions/{sessionId}/questions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Knowledge]
      summary: Ask a knowledge question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeQuestionRequest'
      responses:
        '200':
          description: Answer with citations or insufficient-evidence result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeAnswerEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /projects/{projectId}/ai/task-plans:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [TaskPlans]
      summary: List task plans
      responses:
        '200':
          description: Task plans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPlanListEnvelope'
    post:
      tags: [TaskPlans]
      summary: Generate task plan asynchronously
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTaskPlanRequest'
      responses:
        '202':
          description: Generation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPlanEnvelope'
  /projects/{projectId}/ai/task-plans/{planId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PlanId'
    get:
      tags: [TaskPlans]
      summary: Get plan draft
      responses:
        '200':
          description: Task plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPlanEnvelope'
    delete:
      tags: [TaskPlans]
      summary: Delete unconfirmed plan
      responses:
        '204':
          description: Deleted
  /projects/{projectId}/ai/task-plans/{planId}/draft:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PlanId'
    put:
      tags: [TaskPlans]
      summary: Replace editable plan draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPlanDraft'
      responses:
        '200':
          description: Draft replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPlanEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /projects/{projectId}/ai/task-plans/{planId}/confirm:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PlanId'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [TaskPlans]
      summary: Confirm and transactionally create milestones, tasks and dependencies
      responses:
        '200':
          description: Plan applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyTaskPlanEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /projects/{projectId}/dashboard:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Dashboard]
      summary: Project dashboard
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'
  /projects/{projectId}/audit-logs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Audit]
      summary: Audit logs; admin or owner
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPageEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MilestoneId:
      name: milestoneId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationCode:
      name: code
      in: path
      required: true
      schema: { type: string, minLength: 32, maxLength: 128 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Unauthorized:
      description: Unauthorized
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Forbidden
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Gone:
      description: Gone
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PayloadTooLarge:
      description: Payload too large
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    UnsupportedMediaType:
      description: Unsupported media type
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TooManyRequests:
      description: Rate limited or provider quota exhausted
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    GatewayTimeout:
      description: Model timeout
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    UnprocessableEntity:
      description: Structured or domain validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    ApiMeta:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { type: 'null' }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 40
          description: Must not be blank.
        password:
          type: string
          description: Must not be blank.
    AcceptInvitationRequest:
      type: object
