openapi: 3.1.0
info:
  title: AI Collab API
  version: 0.1.0
  description: Local-first collaboration platform with RAG knowledge QA and AI task planning.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Invitations
  - name: Projects
  - name: Members
  - name: Milestones
  - name: Tasks
  - name: Comments
  - name: Documents
  - name: Knowledge
  - name: TaskPlans
  - name: Dashboard
  - name: Audit
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login
      description: |
        Public endpoint. Because a successful response sets the HttpOnly Refresh Cookie,
        the request must carry exactly one allowed Origin header. If Origin is absent,
        the server requires exactly one Referer and validates its origin. An untrusted,
        malformed, blank, repeated, or comma-joined source returns 403 before the
        request body reaches the controller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in; returns the Access Token and current user, and sets a new Refresh Cookie.
          headers:
            Set-Cookie:
              description: >
                ai_collab_refresh_token with Path=/api/v1/auth, HttpOnly,
                SameSite=Strict, Secure=false for local HTTP development,
                Secure=true by default in production, and Max-Age no longer
                than the server-side Refresh Token expiry.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '400':
          description: Login request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/registration-policy:
    get:
      tags: [Auth]
      security: []
      summary: Read public registration policy
      responses:
        '200':
          description: Current public registration switch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPolicyEnvelope'
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register a public account and create an authenticated session
      description: >
        Uses the same mandatory Origin/Referer validation, Access Token issuer,
        Refresh session implementation and Cookie settings as login. The endpoint
        returns REGISTRATION_DISABLED with HTTP 403 when public registration is off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered; returns the login response and sets a Refresh Cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '400':
          description: Registration request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Refresh access token using HttpOnly refresh cookie
      description: |
        Public endpoint that reads the Refresh Token only from the configured
        HttpOnly Cookie; an Access Token is neither required nor read. The
        request is subject to the same mandatory Origin/Referer validation as
        login. A successful refresh strictly rotates the submitted credential
        and sets its replacement Cookie.
      responses:
        '200':
          description: Refreshed; returns only a new Access Token and rotates the Refresh Cookie.
          headers:
            Set-Cookie:
              description: Replacement ai_collab_refresh_token with the configured security attributes.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout:
    post:
      tags: [Auth]
      security: []
      summary: Revoke the current Refresh Token session and clear its Cookie
      description: |
        Public and idempotent Cookie endpoint. It requires the same mandatory
        Origin/Referer validation as login and refresh, but does not require an
        Access Token. A missing, unknown, malformed, expired, or already revoked
        Refresh Cookie still returns 200 and clears the browser Cookie. An
        unexpected infrastructure failure returns 500, while the Cookie is
        still cleared.
      responses:
        '200':
          description: Logged out or already logged out
          headers:
            Set-Cookie:
              description: >
                Clears ai_collab_refresh_token using the configured Path,
                HttpOnly, SameSite and Secure attributes with Max-Age=0.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponseEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Unexpected server or persistence failure; the Cookie is still cleared
          headers:
            Set-Cookie:
              description: Clears ai_collab_refresh_token with Max-Age=0.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/me:
    patch:
      tags: [Auth]
      summary: Update current user's display name and email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: Safe current-user view without passwordHash or tokenVersion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Profile validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password and revoke every Refresh Token session
      description: >
        Increments token_version and revokes all Refresh sessions in one transaction.
        Already issued Access Tokens remain usable until their own expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed; clears the current browser Refresh Cookie
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoidResponseEnvelope' }
        '400':
          description: Current password invalid, same password, or validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Idempotently revoke all Refresh Token sessions for the current user
      responses:
        '200':
          description: All sessions revoked; clears the current browser Refresh Cookie
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoidResponseEnvelope' }
  /invitations/{code}:
    get:
      tags: [Invitations]
      security: []
      summary: Preview invitation
      description: >
        Hashes the URL-safe invitation code with SHA-256 and performs a read-only lookup.
        The server never returns the stored hash and does not change invitation state.
      parameters:
        - $ref: '#/components/parameters/InvitationCode'
      responses:
        '200':
          description: Invitation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreviewEnvelope'
        '410':
          $ref: '#/components/responses/Gone'
  /invitations/{code}/accept:
    post:
      tags: [Invitations]
      security: []
      summary: Accept invitation and create account
      description: |
        Requires exactly one trusted Origin, or one Referer when Origin is absent.
        Locks the invitation row, creates the user and project membership, marks the
        invitation accepted, writes the audit record, and creates the Refresh session
        in one database transaction. The Set-Cookie header is added after that
        transaction returns. Concurrent acceptance succeeds at most once.
      parameters:
        - $ref: '#/components/parameters/InvitationCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '201':
          description: Account created and invitation accepted
          headers:
            Set-Cookie:
              description: HttpOnly Refresh Cookie with the same security attributes as login.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '400':
          description: Request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
  /invitations/{code}/accept-current-user:
    post:
      tags: [Invitations]
      summary: Accept invitation as the current user
      description: |
        Requires the global Bearer Access Token. It does not accept a request body,
        create an account, issue an Access Token, create a Refresh session, or set a
        Refresh Cookie. The user explicitly accepts after the read-only preview.
        Existing membership is returned without changing the role or consuming the invitation.
      parameters:
        - $ref: '#/components/parameters/InvitationCode'
      responses:
        '200':
          description: Invitation accepted or current membership confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptanceEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden, including an invitation email mismatch
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '410':
          $ref: '#/components/responses/Gone'
  /projects:
    get:
      tags: [Projects]
      summary: List current user's projects
      description: Uses one membership-scoped join; it does not issue one role query per project.
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '400':
          description: Project request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Get project
      description: >
        The project and current membership are selected together. A caller who is not a
        member receives PROJECT_NOT_FOUND, preventing project existence probing.
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Projects]
      summary: Update project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '400':
          description: Project request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Projects]
      summary: Delete project; owner only
      description: >
        Locks the project row and refuses deletion with PROJECT_DOCUMENTS_EXIST while any
        project_document row remains. The owner must delete every document first so MinIO
        objects cannot be orphaned by a database cascade.
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Project still contains documents (PROJECT_DOCUMENTS_EXIST)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Members]
      summary: List members
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/invitations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Members]
      summary: Create invitation
      description: >
        OWNER and ADMIN only. Generates 32 random bytes with SecureRandom, returns the
        unpadded URL-safe Base64 code once, and stores only its SHA-256 digest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationEnvelope'
        '400':
          description: Invitation request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/members/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Members]
      summary: Change member role; owner only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: Role changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberEnvelope'
        '400':
          description: Role request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Members]
      summary: Remove member; owner only
      responses:
        '204':
          description: Removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/milestones:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Milestones]
      summary: List milestones
      responses:
        '200':
          description: Milestone list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneListEnvelope'
    post:
      tags: [Milestones]
      summary: Create milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMilestoneRequest'
      responses:
        '201':
          description: Milestone created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneEnvelope'
  /projects/{projectId}/milestones/{milestoneId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/MilestoneId'
    patch:
      tags: [Milestones]
      summary: Update milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMilestoneRequest'
      responses:
        '200':
          description: Milestone updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneEnvelope'
    delete:
      tags: [Milestones]
      summary: Delete milestone
      responses:
        '204':
          description: Deleted
  /projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tasks]
      summary: List tasks
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
        - name: milestoneId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListEnvelope'
    post:
      tags: [Tasks]
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get task
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
    patch:
      tags: [Tasks]
      summary: Update task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Tasks]
      summary: Delete task
      responses:
        '204':
          description: Deleted
  /projects/{projectId}/tasks/{taskId}/dependencies:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    put:
      tags: [Tasks]
      summary: Replace task dependencies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dependencyIds]
              properties:
                dependencyIds:
                  type: array
                  maxItems: 10
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Dependencies replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}/tasks/{taskId}/comments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Comments]
      summary: List comments
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListEnvelope'
    post:
      tags: [Comments]
      summary: Add comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentEnvelope'
  /projects/{projectId}/tasks/{taskId}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/CommentId'
    patch:
      tags: [Comments]
      summary: Edit own comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200':
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentEnvelope'
    delete:
      tags: [Comments]
      summary: Delete comment
      responses:
        '204':
          description: Deleted
  /projects/{projectId}/documents:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Documents]
      summary: List documents
      description: Project members can list documents, ordered by createdAt descending. Object keys, chunk content, and vectors are never returned.
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Documents]
      summary: Upload document
      description: >
        OWNER and ADMIN can upload one validated PDF, DOCX, Markdown, or TXT file.
        Validation and the private MinIO put happen outside the database transaction.
        A short registration transaction locks the ACTIVE project row, checks the
        100-document limit, inserts metadata and audit, and publishes the after-commit event.
        If registration fails, the already-written object is compensating-deleted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                displayName:
                  type: string
                  maxLength: 180
      responses:
        '202':
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /projects/{projectId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      summary: Get document
      description: A project member can read safe metadata. Cross-project and non-member access use the same 404 response.
      responses:
        '200':
          description: Document detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Documents]
      summary: Delete document and its chunks
      description: OWNER and ADMIN only. Deletes the private object, chunks, citations through foreign keys, and document row.
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /projects/{projectId}/documents/{documentId}/download-url:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      summary: Create five-minute presigned download URL
      description: Project members receive an ephemeral URL for the private bucket. DELETING documents cannot be downloaded.
      responses:
        '200':
          description: Download URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrlEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /projects/{projectId}/documents/{documentId}/retry:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [Documents]
      summary: Retry failed processing
      description: >
        OWNER and ADMIN only. Resets the same FAILED document to UPLOADED and reuses its
        existing private object. A new processing token is generated when the worker claims
        the retry; an older worker cannot heartbeat, fail, replace chunks, or complete it.
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /projects/{projectId}/knowledge/sessions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Knowledge]
      summary: List own sessions
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSessionListEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Knowledge]
      summary: Create session
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSessionEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/knowledge/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Knowledge]
      summary: Get own session with messages
      responses:
        '200':
          description: Session detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSessionDetailEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Knowledge]
      summary: Delete own session
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/knowledge/sessions/{sessionId}/questions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Knowledge]
      summary: Ask a knowledge question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeQuestionRequest'
      responses:
        '200':
          description: Answer with citations or insufficient-evidence result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeAnswerEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/GatewayTimeout' }
  /projects/{projectId}/ai/task-plans:
    x-implementation-status: planned
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [TaskPlans]
      summary: List task plans
      responses:
        '200':
          description: Task plans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPlanListEnvelope'
    post:
      tags: [TaskPlans]
      summary: Generate task plan asynchronously
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateTaskPlanRequest'
      responses:
        '202':
          description: Generation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPlanEnvelope'
  /projects/{projectId}/ai/task-plans/{planId}:
    x-implementation-status: planned
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PlanId'
    get:
      tags: [TaskPlans]
      summary: Get plan draft
      responses:
        '200':
          description: Task plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPlanEnvelope'
    delete:
      tags: [TaskPlans]
      summary: Delete unconfirmed plan
      responses:
        '204':
          description: Deleted
  /projects/{projectId}/ai/task-plans/{planId}/draft:
    x-implementation-status: planned
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PlanId'
    put:
      tags: [TaskPlans]
      summary: Replace editable plan draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPlanDraft'
      responses:
        '200':
          description: Draft replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPlanEnvelope'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /projects/{projectId}/ai/task-plans/{planId}/confirm:
    x-implementation-status: planned
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PlanId'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [TaskPlans]
      summary: Confirm and transactionally create milestones, tasks and dependencies
      responses:
        '200':
          description: Plan applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyTaskPlanEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /projects/{projectId}/dashboard:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Dashboard]
      summary: Project dashboard
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'
  /projects/{projectId}/audit-logs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Audit]
      summary: Audit logs; admin or owner
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPageEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MilestoneId:
      name: milestoneId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationCode:
      name: code
      in: path
      required: true
      schema: { type: string, minLength: 32, maxLength: 128 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    BadRequest:
      description: Invalid request or file content
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: Unauthorized
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Forbidden
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Gone:
      description: Gone
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PayloadTooLarge:
      description: Payload too large
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    UnsupportedMediaType:
      description: Unsupported media type
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TooManyRequests:
      description: Rate limited or provider quota exhausted
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    GatewayTimeout:
      description: Model timeout
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    UnprocessableEntity:
      description: Structured or domain validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    BadGateway:
      description: Embedding or Chat provider failed or returned an invalid response
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ServiceUnavailable:
      description: Private object storage or configured Chat service is unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    ApiMeta:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { type: 'null' }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 40
          description: Must not be blank.
        password:
          type: string
          description: Must not be blank.
    RegisterRequest:
      type: object
      required: [username, password, displayName]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9_]{3,40}$' }
        password: { type: string, minLength: 8, maxLength: 72, writeOnly: true }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        email: { type: [string, 'null'], format: email, maxLength: 120 }
    RegistrationPolicy:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    RegistrationPolicyEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/RegistrationPolicy' }
    UpdateCurrentUserRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 60 }
        email: { type: [string, 'null'], format: email, maxLength: 120 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, writeOnly: true }
        newPassword: { type: string, minLength: 8, maxLength: 72, writeOnly: true }
    AcceptInvitationRequest:
      type: object
      required: [username, password, displayName]
      properties:
        username: { type: string, pattern: '^[a-zA-Z0-9_]{3,40}$' }
        password: { type: string, minLength: 8, maxLength: 72, writeOnly: true }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        email:
          type: string
          format: email
          maxLength: 120
          description: >
            Optional. When the invitation is bound to an email, an omitted value uses
            that email and a supplied value must match it case-insensitively.
    AuthResult:
      type: object
      required: [accessToken, expiresInSeconds, user]
      properties:
        accessToken: { type: string }
        expiresInSeconds: { type: integer, format: int64, example: 1800 }
        user: { $ref: '#/components/schemas/UserView' }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer, format: int64, example: 1800 }
        user: { $ref: '#/components/schemas/UserView' }
    AccessTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer, format: int64, example: 1800 }
    LoginResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/LoginResponse' }
    AccessTokenResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/AccessTokenResponse' }
    VoidResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { type: 'null' }
    AuthResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/AuthResult' }
    UserView:
      type: object
      required: [id, username, displayName, status]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: [string, 'null'], format: email }
        status: { type: string, enum: [ACTIVE, DISABLED] }
    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/UserView' }
    ProjectRole:
      type: string
      enum: [OWNER, ADMIN, MEMBER]
    ProjectView:
      type: object
      required: [id, name, status, role, ownerId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        ownerId: { type: string, format: uuid }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        role: { $ref: '#/components/schemas/ProjectRole' }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000, default: '' }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
    UpdateProjectRequest:
      allOf:
        - $ref: '#/components/schemas/CreateProjectRequest'
        - type: object
          required: [version]
          properties:
            status: { type: string, enum: [ACTIVE, ARCHIVED] }
            version: { type: integer, minimum: 0 }
    ProjectEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ProjectView' }
    ProjectListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/ProjectView' }
    MemberView:
      type: object
      required: [userId, username, displayName, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/ProjectRole' }
        joinedAt: { type: string, format: date-time }
    MemberEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MemberView' }
    MemberListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/MemberView' }
    CreateInvitationRequest:
      type: object
      required: [role, expiresInHours]
      properties:
        role: { type: string, enum: [ADMIN, MEMBER] }
        invitedEmail: { type: [string, 'null'], format: email, maxLength: 120 }
        expiresInHours: { type: integer, minimum: 1, maximum: 168, default: 72 }
    InvitationView:
      type: object
      required: [id, code, projectId, role, expiresAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        projectId: { type: string, format: uuid }
        role: { type: string, enum: [ADMIN, MEMBER] }
        expiresAt: { type: string, format: date-time }
    InvitationPreview:
      type: object
      required: [projectId, projectName, role, expiresAt]
      properties:
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        role: { type: string, enum: [ADMIN, MEMBER] }
        invitedEmail: { type: [string, 'null'], format: email }
        expiresAt: { type: string, format: date-time }
    InvitationAcceptanceResult:
      type: object
      required: [projectId, projectName, role, alreadyMember]
      properties:
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        role: { $ref: '#/components/schemas/ProjectRole' }
        alreadyMember: { type: boolean }
    InvitationEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/InvitationView' }
    InvitationPreviewEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/InvitationPreview' }
    InvitationAcceptanceEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/InvitationAcceptanceResult' }
    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [ADMIN, MEMBER] }
    MilestoneStatus:
      type: string
      enum: [PLANNED, ACTIVE, COMPLETED, CANCELED]
    CreateMilestoneRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000, default: '' }
        targetDate: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/MilestoneStatus' }
        sortOrder: { type: integer, minimum: 0 }
    UpdateMilestoneRequest:
      allOf:
        - $ref: '#/components/schemas/CreateMilestoneRequest'
        - type: object
          required: [status, sortOrder, version]
          properties:
            version: { type: integer, minimum: 0 }
    MilestoneView:
      type: object
      required: [id, projectId, name, description, status, sortOrder, version]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        targetDate: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/MilestoneStatus' }
        sortOrder: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 0 }
    MilestoneEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MilestoneView' }
    MilestoneListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/MilestoneView' }
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, BLOCKED, DONE, CANCELED]
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 4000, default: '' }
        milestoneId: { type: [string, 'null'], format: uuid }
        assigneeId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        estimateHours: { type: [number, 'null'], minimum: 0.5, maximum: 80 }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
    UpdateTaskRequest:
      type: object
      required: [version]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 4000 }
        milestoneId: { type: [string, 'null'], format: uuid }
        assigneeId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        estimateHours: { type: [number, 'null'], minimum: 0.5, maximum: 80 }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        version: { type: integer, minimum: 0 }
      description: >
        OWNER/ADMIN must send title, status, priority and the complete editable task snapshot.
        MEMBER may send only status and version, and only for a task assigned to that member.
    TaskView:
      type: object
      required:
        [id, projectId, title, description, status, priority, version,
         unfinishedDependencyCount, dependencyIds]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        milestoneId: { type: [string, 'null'], format: uuid }
        milestoneName: { type: [string, 'null'] }
        assigneeId: { type: [string, 'null'], format: uuid }
        assigneeDisplayName: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        estimateHours: { type: [number, 'null'], minimum: 0.5, maximum: 80 }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        version: { type: integer, minimum: 0 }
        unfinishedDependencyCount: { type: integer, minimum: 0 }
        dependencyIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }
    TaskEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TaskView' }
    TaskListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/TaskView' }
    CommentRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
    CommentView:
      type: object
      required: [id, taskId, authorId, authorDisplayName, content, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorDisplayName: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CommentEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/CommentView' }
    CommentListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/CommentView' }
    DocumentStatus:
      type: string
      enum: [UPLOADED, PARSING, INDEXING, READY, FAILED, DELETING]
    DocumentView:
      type: object
      description: Safe document metadata. objectKey, extracted text, chunks, vectors, credentials, and server paths are intentionally absent.
      required: [id, projectId, displayName, originalFilename, mimeType, sizeBytes, status, chunkCount, uploadedById, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        displayName: { type: string }
        originalFilename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        parserType: { type: [string, 'null'] }
        chunkCount: { type: integer }
        embeddingProvider: { type: [string, 'null'] }
        embeddingModel: { type: [string, 'null'] }
        embeddingDimension: { type: [integer, 'null'] }
        errorMessage: { type: [string, 'null'] }
        uploadedById: { type: string, format: uuid }
        uploadedByDisplayName: { type: [string, 'null'] }
        indexedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DocumentEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/DocumentView' }
    DocumentListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/DocumentView' }
    DownloadUrlEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: object
              required: [url, expiresAt]
              properties:
                url: { type: string, format: uri }
                expiresAt: { type: string, format: date-time }
    KnowledgeSessionView:
      type: object
      required: [id, projectId, title, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateKnowledgeSessionRequest:
      type: object
      properties:
        title:
          type: [string, 'null']
          maxLength: 120
    CitationView:
      type: object
      required: [documentId, filename, chunkId, heading, quote, similarity, rank]
      properties:
        documentId: { type: string, format: uuid }
        filename: { type: string }
        chunkId: { type: string, format: uuid }
        heading: { type: [string, 'null'] }
        quote: { type: string }
        similarity: { type: number, minimum: -1, maximum: 1 }
        rank: { type: integer, minimum: 1 }
    KnowledgeMessageView:
      type: object
      required: [id, role, content, insufficientEvidence, model, citations, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [USER, ASSISTANT] }
        content: { type: string }
        insufficientEvidence: { type: boolean }
        model: { type: [string, 'null'] }
        citations:
          type: array
          items: { $ref: '#/components/schemas/CitationView' }
        createdAt: { type: string, format: date-time }
    KnowledgeQuestionRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 1000 }
        documentIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
    KnowledgeAnswer:
      type: object
      required: [answer, insufficientEvidence, model, citations]
      properties:
        answer: { type: string }
        insufficientEvidence: { type: boolean }
        model: { type: [string, 'null'] }
        citations:
          type: array
          items: { $ref: '#/components/schemas/CitationView' }
    KnowledgeSessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/KnowledgeSessionView' }
    KnowledgeSessionListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/KnowledgeSessionView' }
    KnowledgeSessionDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [session, messages]
              properties:
                session: { $ref: '#/components/schemas/KnowledgeSessionView' }
                messages:
                  type: array
                  items: { $ref: '#/components/schemas/KnowledgeMessageView' }
    KnowledgeAnswerEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/KnowledgeAnswer' }
    GenerateTaskPlanRequest:
      type: object
      required: [goal, startDate, dueDate, maxTasks]
      properties:
        goal: { type: string, minLength: 20, maxLength: 2000 }
        startDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        maxTasks: { type: integer, minimum: 5, maximum: 50, default: 30 }
        documentIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }
        constraints:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 200 }
    TaskPlanStatus:
      type: string
      enum: [GENERATING, READY, CONFIRMED, FAILED, CANCELED]
    MilestoneDraft:
      type: object
      required: [tempKey, name, description, sortOrder]
      properties:
        tempKey: { type: string, pattern: '^M[1-9][0-9]*$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        targetDate: { type: [string, 'null'], format: date }
        sortOrder: { type: integer, minimum: 0 }
    TaskDraft:
      type: object
      required: [tempKey, milestoneTempKey, title, description, priority, dependencyTempKeys, sourceDocumentIds, sortOrder]
      properties:
        tempKey: { type: string, pattern: '^T[1-9][0-9]*$' }
        milestoneTempKey: { type: string, pattern: '^M[1-9][0-9]*$' }
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 4000 }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        estimateHours: { type: [number, 'null'], minimum: 0.5, maximum: 80 }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        suggestedAssigneeId: { type: [string, 'null'], format: uuid }
        dependencyTempKeys:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: string, pattern: '^T[1-9][0-9]*$' }
        sourceDocumentIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        sortOrder: { type: integer, minimum: 0 }
    TaskPlanDraft:
      type: object
      required: [summary, assumptions, risks, milestones, tasks]
      properties:
        summary: { type: string, maxLength: 4000 }
        assumptions:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 300 }
        risks:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 300 }
        milestones:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/MilestoneDraft' }
        tasks:
          type: array
          minItems: 5
          maxItems: 50
          items: { $ref: '#/components/schemas/TaskDraft' }
    TaskPlanView:
      type: object
      required: [id, projectId, goal, startDate, dueDate, maxTasks, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        goal: { type: string }
        startDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        maxTasks: { type: integer }
        status: { $ref: '#/components/schemas/TaskPlanStatus' }
        modelProvider: { type: [string, 'null'] }
        modelName: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        draft: { oneOf: [{ $ref: '#/components/schemas/TaskPlanDraft' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        confirmedAt: { type: [string, 'null'], format: date-time }
    TaskPlanEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TaskPlanView' }
    TaskPlanListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/TaskPlanView' }
    ApplyTaskPlanResult:
      type: object
      required: [planId, milestoneIds, taskIds]
      properties:
        planId: { type: string, format: uuid }
        milestoneIds:
          type: array
          items: { type: string, format: uuid }
        taskIds:
          type: array
          items: { type: string, format: uuid }
    ApplyTaskPlanEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ApplyTaskPlanResult' }
    DashboardView:
      type: object
      required: [taskCounts, completionRate, overdueCount, milestoneProgress, recentActivities]
      properties:
        taskCounts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        completionRate: { type: number, minimum: 0, maximum: 1 }
        overdueCount: { type: integer, minimum: 0 }
        milestoneProgress:
          type: array
          items:
            type: object
            required: [milestoneId, name, completionRate]
            properties:
              milestoneId: { type: string, format: uuid }
              name: { type: string }
              completionRate: { type: number, minimum: 0, maximum: 1 }
        recentActivities:
          type: array
          items: { $ref: '#/components/schemas/AuditView' }
    DashboardEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/DashboardView' }
    AuditView:
      type: object
      required: [id, action, entityType, requestId, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: [string, 'null'], format: uuid }
        userDisplayName: { type: [string, 'null'] }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, 'null'], format: uuid }
        detail: { type: object, additionalProperties: true }
        requestId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    AuditPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: object
              required: [items, page, size, total]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/AuditView' }
                page: { type: integer }
                size: { type: integer }
                total: { type: integer, format: int64 }
