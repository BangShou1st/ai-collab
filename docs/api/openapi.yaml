  /projects/{projectId}/documents:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Documents]
      summary: List documents
      description: Project members can list documents, ordered by createdAt descending. Object keys, chunk content, and vectors are never returned.
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Documents]
      summary: Upload document
      description: >
        OWNER and ADMIN can upload one validated PDF, DOCX, Markdown, or TXT file.
        Validation and the private MinIO put happen outside the database transaction.
        PREPARING and ACTIVE projects are writable; COMPLETED and ARCHIVED projects
        return PROJECT_READ_ONLY. A short registration transaction locks the project row,
        checks its status and the 100-document limit, inserts metadata and audit, and
        publishes the after-commit event. If registration fails, the already-written object
        is compensating-deleted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                displayName:
                  type: string
                  maxLength: 180
      responses:
        '202':
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Project is read-only (PROJECT_READ_ONLY), or the document limit was reached
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /projects/{projectId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      summary: Get document
      description: A project member can read safe metadata. Cross-project and non-member access use the same 404 response.
      responses:
        '200':
          description: Document detail
          content:
            application/json:
              schema:
