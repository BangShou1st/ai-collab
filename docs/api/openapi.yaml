    delete:
      tags: [Documents]
      summary: Delete document and its chunks
      description: OWNER and ADMIN only. PREPARING and ACTIVE projects are writable; COMPLETED and ARCHIVED return PROJECT_READ_ONLY. Deletes the private object, chunks, citations through foreign keys, and document row.
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
