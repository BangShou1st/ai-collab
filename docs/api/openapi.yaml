          description: Token, citation, error, and done events
          content:
            text/event-stream: {}
  /projects/{projectId}/knowledge/sessions/messages/{messageId}/feedback:
    get:
      tags: [Knowledge]
      summary: Get current user's feedback for an owned assistant message
      responses:
        '200': { description: Feedback counts and current choice }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Knowledge]
      summary: Submit feedback for an owned assistant message
      responses:
        '200': { description: Feedback saved }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Knowledge]
      summary: Remove feedback from an owned assistant message
      responses:
        '204': { description: Feedback removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/knowledge/eval/run:
    post:
      tags: [Knowledge]
      summary: Start a project-admin retrieval evaluation
      responses:
        '202': { description: Evaluation started }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{projectId}/knowledge/eval/runs:
    get:
      tags: [Knowledge]
      summary: List project retrieval evaluations
      responses:
        '200': { description: Evaluation run list }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{projectId}/knowledge/eval/runs/{runId}:
    get:
      tags: [Knowledge]
      summary: Get one project retrieval evaluation
      responses:
        '200': { description: Evaluation detail }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/tasks/batch:
    post:
      tags: [Tasks]
      summary: Atomically update selected tasks
      responses:
        '200': { description: Updated tasks }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/visualization/gantt:
    get:
      tags: [Work visualization]
      summary: Get project Gantt data
      responses:
        '200': { description: Tasks, milestones, and dependencies }
  /projects/{projectId}/visualization/dependency-graph:
    get:
      tags: [Work visualization]
      summary: Get project dependency graph
      responses:
        '200': { description: Graph nodes and edges }
  /projects/{projectId}/visualization/calendar:
    get:
      tags: [Work visualization]
      summary: Get project calendar events
      responses:
        '200': { description: Calendar events }
  /projects/{projectId}/visualization/member-load:
    get:
      tags: [Work visualization]
      summary: Get project member workload
      responses:
        '200': { description: Member workload metrics }
  /projects/{projectId}/reports/weekly:
    get:
      tags: [Reports]
      summary: Get deterministic project weekly report
      responses:
        '200': { description: Weekly report }
  /projects/{projectId}/reports/risks:
    get:
      tags: [Reports]
      summary: Get overdue, blocked, and unassigned task risks
      responses:
        '200': { description: Risk analysis }
  /projects/{projectId}/reports/plan-comparison:
    get:
      tags: [Reports]
      summary: Compare latest plan tasks with confirmed project tasks
      parameters:
        - { name: planId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Field-level plan comparison }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/agent/sessions:
    get:
      tags: [Agent]
      summary: List Agent sessions
      responses: { '200': { description: Session list } }
    post:
      tags: [Agent]
      summary: Create an Agent session
      responses: { '201': { description: Session created } }
  /projects/{projectId}/agent/sessions/{sessionId}:
    get:
      tags: [Agent]
      summary: Get an Agent session
      responses: { '200': { description: Session detail } }
    patch:
      tags: [Agent]
      summary: Rename an owned Agent session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 160 }
      responses:
        '200': { description: Session renamed }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Agent]
      summary: Delete an owned Agent session and its history
      responses:
        '204': { description: Session deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/agent/sessions/{sessionId}/messages:
    get:
      tags: [Agent]
      summary: List Agent messages
      responses: { '200': { description: Message list } }
    post:
      tags: [Agent]
      summary: Submit an Agent request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitAgentMessageRequest' }
      responses:
        '202':
          description: Run queued
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentRunEnvelope' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/agent/session-summaries:
    get:
      tags: [Agent]
      summary: List Agent session summaries with latest run in one query (no N+1)
      responses:
        '200':
          description: Session summaries with latestRunId, latestRunStatus, latestActivityAt, creatorName
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentSessionSummaryListEnvelope' } } }
  /projects/{projectId}/agent/sessions/{sessionId}/latest-run:
    get:
      tags: [Agent]
      summary: Get current or latest run detail for a session (null when none)
      responses:
        '200':
          description: AgentRunDetail or null for refresh/switch restore
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentRunDetailEnvelope' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/agent/runs/{runId}:
    get:
      tags: [Agent]
      summary: Get normalized run and step details
      responses:
        '200':
          description: Run detail including plan, steps, cursor and pending approval
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentRunDetailEnvelope' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/agent/runs/{runId}/events:
    get:
      tags: [Agent]
      summary: Replay and stream durable Agent run events
      description: Project members only. Frames use the event sequence as SSE id; reconnect with Last-Event-ID or afterSequence.
      parameters:
        - { name: Last-Event-ID, in: header, required: false, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: afterSequence, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200':
          description: Durable replay followed by live events and heartbeat comments
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/AgentRunEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/agent/runs/{runId}/events-history:
    get:
      tags: [Agent]
      summary: List persisted Agent run events as JSON for history hydration
      description: Project members only. Used to restore timeline, plan and activities on refresh or session switch; live updates continue over the SSE endpoint from lastEventSequence.
      parameters:
        - { name: afterSequence, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200':
          description: Persisted events in sequence order (max 500), ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AgentRunEventResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/agent/runs/{runId}/cancel:
    post:
      tags: [Agent]
      summary: Cancel an Agent run
      responses: { '204': { description: Run canceled } }
  /projects/{projectId}/agent/runs/{runId}/retry:
    post:
      tags: [Agent]
      summary: Retry an Agent run
      responses: { '200': { description: Retry queued } }
  /projects/{projectId}/agent/runs/{runId}/continue:
    post:
      tags: [Agent]
      summary: Continue an Agent run waiting for user input
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 4000
      responses: { '200': { description: Run continued } }
  /projects/{projectId}/agent/runs/{runId}/approvals:
    get:
      tags: [Agent]
      summary: List approvals scoped to the current run only
      responses:
        '200':
          description: Current run approvals (no cross-session mixing), ApiResponse envelope
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AgentApproval' }
  /projects/{projectId}/agent/approvals:
    get:
      tags: [Agent]
      summary: List Agent approvals
      responses: { '200': { description: Approval list } }
  /projects/{projectId}/agent/approvals/{approvalId}/approve:
    post:
      tags: [Agent]
      summary: Approve and execute a proposed write
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Proposal executed } }
  /projects/{projectId}/agent/approvals/{approvalId}/reject:
    post:
      tags: [Agent]
      summary: Reject a proposed write
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Proposal rejected } }
  /projects/{projectId}/agent/schedules:
    get:
      tags: [Agent]
      summary: List Agent schedules
      responses: { '200': { description: Schedule list } }
    post:
      tags: [Agent]
      summary: Create an Agent schedule
      responses: { '201': { description: Schedule created } }
  /projects/{projectId}/agent/schedules/{scheduleId}/enable:
    post:
      tags: [Agent]
      summary: Enable an Agent schedule
      responses: { '200': { description: Schedule enabled } }
  /projects/{projectId}/agent/schedules/{scheduleId}/disable:
    post:
      tags: [Agent]
      summary: Disable an Agent schedule
      responses: { '200': { description: Schedule disabled } }
  /projects/{projectId}/agent/skills:
    get:
      tags: [Agent]
      summary: List fixed server-side Agent skills available to project members
      responses: { '200': { description: Skill list } }
  /projects/{projectId}/agent/memories:
    get:
      tags: [Agent]
      summary: List project-scoped Agent memories
      parameters:
        - { name: activeOnly, in: query, schema: { type: boolean, default: false } }
      responses: { '200': { description: Memory list }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      tags: [Agent]
      summary: Create a user-confirmed project memory (project ADMIN required)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentMemoryRequest' } } }
      responses: { '200': { description: Memory created }, '403': { $ref: '#/components/responses/Forbidden' } }
  /projects/{projectId}/agent/memories/{id}:
    patch:
      tags: [Agent]
      summary: Update project memory using optimistic versioning (project ADMIN required)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentMemoryRequest' } } }
      responses: { '200': { description: Memory updated }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      tags: [Agent]
      summary: Disable project memory (project ADMIN required)
      parameters:
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 0 } }
      responses: { '200': { description: Memory disabled }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/agent/mcp-connections:
    get:
      tags: [Agent MCP]
      summary: List MCP connections (system admin only; credentials never returned)
      responses:
        '200':
          description: Connection list
          content: { application/json: { schema: { $ref: '#/components/schemas/McpConnectionListEnvelope' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Agent MCP]
      summary: Create MCP connection (system admin only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/McpConnectionRequest' } } }
      responses:
        '201':
          description: Connection created
          content: { application/json: { schema: { $ref: '#/components/schemas/McpConnectionEnvelope' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/agent/mcp-connections/{id}:
    patch:
      tags: [Agent MCP]
      summary: Update and disable MCP connection pending rediscovery
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/McpConnectionRequest' } } }
      responses:
        '200':
          description: Connection updated
          content: { application/json: { schema: { $ref: '#/components/schemas/McpConnectionEnvelope' } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/agent/mcp-connections/{id}/test:
    post: { tags: [Agent MCP], summary: Test MCP initialization with timeout, responses: { '200': { description: Health updated, content: { application/json: { schema: { $ref: '#/components/schemas/McpConnectionEnvelope' } } } }, '504': { $ref: '#/components/responses/GatewayTimeout' } } }
  /admin/agent/mcp-connections/{id}/discover:
    post: { tags: [Agent MCP], summary: Discover tools/resources and compute canonical schema hash, responses: { '200': { description: Discovery saved, content: { application/json: { schema: { $ref: '#/components/schemas/McpConnectionEnvelope' } } } } } }
  /admin/agent/mcp-connections/{id}/enable:
    post:
      tags: [Agent MCP]
      summary: Confirm current schema and enable connection
      parameters: [{ name: version, in: query, required: true, schema: { type: integer, minimum: 0 } }]
      responses: { '200': { description: Connection enabled, content: { application/json: { schema: { $ref: '#/components/schemas/McpConnectionEnvelope' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/agent/mcp-connections/{id}/disable:
    post:
      tags: [Agent MCP]
      summary: Disable connection and invalidate managed client
      parameters: [{ name: version, in: query, required: true, schema: { type: integer, minimum: 0 } }]
      responses: { '200': { description: Connection disabled, content: { application/json: { schema: { $ref: '#/components/schemas/McpConnectionEnvelope' } } } } }
  /projects/{projectId}/agent/mcp-bindings:
    get:
      tags: [Agent MCP]
      summary: List project MCP bindings (project members)
      responses: { '200': { description: Binding list, content: { application/json: { schema: { $ref: '#/components/schemas/McpBindingListEnvelope' } } } } }
  /projects/{projectId}/agent/mcp-bindings/{connectionId}:
    put:
      tags: [Agent MCP]
      summary: Bind approved MCP tools to project (project OWNER only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/McpBindingRequest' } } }
      responses: { '200': { description: Binding saved, content: { application/json: { schema: { $ref: '#/components/schemas/McpBindingEnvelope' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      tags: [Agent MCP]
      summary: Remove project MCP binding (project OWNER only)
      responses: { '204': { description: Binding removed }, '403': { $ref: '#/components/responses/Forbidden' } }
  /user/ai-providers:
    get:
      tags: [User AI]
      summary: List my AI providers (credential owner is always the caller)
      responses:
        '200':
          description: Provider list; API keys are never returned
          content: { application/json: { schema: { $ref: '#/components/schemas/UserAiProviderListEnvelope' } } }
    post:
      tags: [User AI]
      summary: Create an AI provider (first one becomes default)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserAiProviderRequest' } } }
      responses:
        '201':
          description: Provider created
          content: { application/json: { schema: { $ref: '#/components/schemas/UserAiProviderEnvelope' } } }
        '400':
          description: Provider request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /user/ai-providers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [User AI]
      summary: Update my AI provider (blank API key keeps the stored one)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserAiProviderRequest' } } }
      responses:
        '200':
          description: Provider updated
          content: { application/json: { schema: { $ref: '#/components/schemas/UserAiProviderEnvelope' } } }
        '400':
          description: Unknown provider id for this user
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      tags: [User AI]
      summary: Delete my AI provider (default becomes none, assignments cascade)
      responses: { '204': { description: Provider deleted } }
  /user/ai-providers/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [User AI]
      summary: Test my AI provider connection
      responses:
        '200':
          description: Connection succeeded
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatCompletionResultEnvelope' } } }
        '400':
          description: Provider misconfigured or unreachable
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /user/ai-provider-presets:
    get:
      tags: [User AI]
      summary: List available provider presets with my connection status
      responses:
        '200':
          description: Preset list (server-owned endpoint/policy, no secrets returned)
          content: { application/json: { schema: { $ref: '#/components/schemas/ProviderPresetListEnvelope' } } }
  /user/ai-provider-presets/OPENCODE_ZEN_FREE/models:
    get:
      tags: [User AI]
      summary: List current OpenCode Zen free models (dynamic *-free discovery)
      parameters:
        - { name: refresh, in: query, required: false, schema: { type: boolean } }
      responses:
        '200':
          description: Free model ids (no hardcoded fallback)
          content: { application/json: { schema: { $ref: '#/components/schemas/FreeModelListEnvelope' } } }
  /user/ai-provider-presets/OPENCODE_ZEN_FREE:
    put:
      tags: [User AI]
      summary: Save my Zen connection (blank apiKey keeps stored key; model must be current *-free)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveZenPresetRequest' } } }
      responses:
        '200':
          description: Zen connection saved
          content: { application/json: { schema: { $ref: '#/components/schemas/ProviderPresetEnvelope' } } }
  /user/ai-provider-presets/OPENCODE_ZEN_FREE/test:
    post:
      tags: [User AI]
      summary: Test Zen connection (saved or provided key, fresh correlation id)
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/TestZenPresetRequest' } } }
      responses: { '200': { description: Connection succeeded } }
  /user/ai-providers/defaults:
    put:
      tags: [User AI]
      summary: Set my default AI provider (replaces the previous default)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SetDefaultRequest' } } }
      responses: { '200': { description: Default updated } }
  /user/ai-providers/purposes:
    get:
      tags: [User AI]
      summary: Read current user purpose assignments (real DB overrides)
      responses:
        '200':
          description: Map of purpose to provider id (empty when using default)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        additionalProperties: { type: string, format: uuid }
  /user/ai-providers/purposes/{purpose}:
    parameters:
      - name: purpose
        in: path
        required: true
        schema: { type: string, enum: [KNOWLEDGE_CHAT, PLANNING, AGENT] }
    put:
      tags: [User AI]
      summary: Override the default model for one purpose
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserAiPurposeRequest' } } }
      responses: { '200': { description: Override saved } }
    delete:
      tags: [User AI]
      summary: Remove the purpose override (falls back to default)
      responses: { '204': { description: Override removed } }
  /home:
    get:
      tags: [Home]
      summary: Personal workspace aggregate (single bounded call)
      responses:
        '200':
          description: Home workspace data
          content: { application/json: { schema: { $ref: '#/components/schemas/HomeViewEnvelope' } } }
  /admin/embedding-config:
    get:
      tags: [Admin Embedding]
      summary: Read system embedding config (system admin only; key never returned)
      responses:
        '200':
          description: System embedding config with stale index count
          content: { application/json: { schema: { $ref: '#/components/schemas/SystemEmbeddingConfigEnvelope' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin Embedding]
      summary: Update system embedding config (semantic change with stale vectors requires reindex)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SystemEmbeddingConfigRequest' } } }
      responses:
        '200':
          description: Config updated
          content: { application/json: { schema: { $ref: '#/components/schemas/SystemEmbeddingConfigEnvelope' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Stale vectors exist; rebuild the index first
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /admin/embedding-config/test:
    post:
      tags: [Admin Embedding]
      summary: Test system embedding connection (system admin only)
      responses:
        '200': { description: Connection succeeded }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/embedding-config/reindex:
    post:
      tags: [Admin Embedding]
      summary: Save new embedding config and rebuild all indexes (system admin only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SystemEmbeddingConfigRequest' } } }
      responses:
        '200':
          description: Rebuild queued
          content: { application/json: { schema: { $ref: '#/components/schemas/ReindexResultEnvelope' } } }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MilestoneId:
      name: milestoneId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationCode:
      name: code
      in: path
      required: true
      schema: { type: string, minLength: 32, maxLength: 128 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    BadRequest:
      description: Invalid request or file content
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: Unauthorized
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Forbidden
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Gone:
      description: Gone
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    PayloadTooLarge:
      description: Payload too large
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    UnsupportedMediaType:
      description: Unsupported media type
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    TooManyRequests:
      description: Rate limited or provider quota exhausted
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    GatewayTimeout:
      description: Model timeout
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    UnprocessableEntity:
      description: Structured or domain validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    BadGateway:
      description: Embedding or Chat provider failed or returned an invalid response
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ServiceUnavailable:
      description: Private object storage or configured Chat service is unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    ApiMeta:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { type: 'null' }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 40
          description: Must not be blank.
        password:
          type: string
          description: Must not be blank.
    RegisterRequest:
      type: object
      required: [username, password, displayName]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9_]{3,40}$' }
        password: { type: string, minLength: 8, maxLength: 72, writeOnly: true }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        email: { type: [string, 'null'], format: email, maxLength: 120 }
    RegistrationPolicy:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    RegistrationPolicyEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/RegistrationPolicy' }
    UpdateCurrentUserRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 60 }
        email: { type: [string, 'null'], format: email, maxLength: 120 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, writeOnly: true }
        newPassword: { type: string, minLength: 8, maxLength: 72, writeOnly: true }
    AcceptInvitationRequest:
      type: object
      required: [username, password, displayName]
      properties:
        username: { type: string, pattern: '^[a-zA-Z0-9_]{3,40}$' }
        password: { type: string, minLength: 8, maxLength: 72, writeOnly: true }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        email:
          type: string
          format: email
          maxLength: 120
          description: >
            Optional. When the invitation is bound to an email, an omitted value uses
            that email and a supplied value must match it case-insensitively.
    AuthResult:
      type: object
      required: [accessToken, expiresInSeconds, user]
      properties:
        accessToken: { type: string }
        expiresInSeconds: { type: integer, format: int64, example: 1800 }
        user: { $ref: '#/components/schemas/UserView' }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer, format: int64, example: 1800 }
        user: { $ref: '#/components/schemas/UserView' }
    AccessTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresInSeconds: { type: integer, format: int64, example: 1800 }
    LoginResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/LoginResponse' }
    AccessTokenResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/AccessTokenResponse' }
    VoidResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { type: 'null' }
    AuthResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/AuthResult' }
    UserView:
      type: object
      required: [id, username, displayName, status, systemAdmin]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: [string, 'null'], format: email }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        systemAdmin: { type: boolean }
    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/UserView' }
    ProjectRole:
      type: string
      enum: [OWNER, ADMIN, MEMBER]
    ProjectType:
      type: string
      enum: [COMPETITION, COURSE_DESIGN, SOFTWARE_TRAINING, OTHER]
    ProjectView:
      type: object
      required: [id, name, type, status, role, ownerId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        ownerId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ProjectType' }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        role: { $ref: '#/components/schemas/ProjectRole' }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectStatus:
      type: string
      enum: [PREPARING, ACTIVE, COMPLETED, ARCHIVED]
    CreateProjectRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000, default: '' }
        type: { $ref: '#/components/schemas/ProjectType' }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
    UpdateProjectRequest:
      allOf:
        - $ref: '#/components/schemas/CreateProjectRequest'
        - type: object
          required: [version]
          properties:
            status: { $ref: '#/components/schemas/ProjectStatus' }
            version: { type: integer, minimum: 0 }
    ProjectEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ProjectView' }
    ProjectListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/ProjectView' }
    MemberView:
      type: object
      required: [userId, username, displayName, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/ProjectRole' }
        joinedAt: { type: string, format: date-time }
    MemberEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MemberView' }
    MemberListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/MemberView' }
    CreateTestUserRequest:
      type: object
      required: [username, displayName, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 40 }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        password: { type: string, minLength: 6, maxLength: 100 }
    AdminUserView:
      type: object
      required: [id, username, displayName, status, systemAdmin, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: [string, 'null'], format: email }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        systemAdmin: { type: boolean }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ModelProviderType:
      type: string
      enum: [OPENAI_COMPATIBLE, ANTHROPIC, GEMINI]
    ModelPurpose:
      type: string
      enum: [KNOWLEDGE_CHAT, AGENT, PLANNING]
    ModelCapability:
      type: string
      enum: [CHAT, STREAMING, STRUCTURED_OUTPUT, NATIVE_TOOLS, USAGE]
    ModelConfigurationRequest:
      type: object
      required:
        [name, providerType, baseUrl, apiPath, modelName, enabled,
         temperature, maxOutputTokens, capabilities]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        providerType: { $ref: '#/components/schemas/ModelProviderType' }
        baseUrl: { type: string, format: uri, maxLength: 2048 }
        apiPath: { type: string, minLength: 1, maxLength: 512 }
        apiKey: { type: [string, 'null'], writeOnly: true, maxLength: 1000 }
        modelName: { type: string, minLength: 1, maxLength: 160 }
        enabled: { type: boolean }
        temperature: { type: number, minimum: 0, maximum: 2 }
        maxOutputTokens: { type: integer, minimum: 1, maximum: 131072 }
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/ModelCapability' }
    ModelConfigurationView:
      type: object
      required:
        [id, name, providerType, baseUrl, apiPath, hasApiKey, modelName,
         enabled, temperature, maxOutputTokens, capabilities, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        providerType: { $ref: '#/components/schemas/ModelProviderType' }
        baseUrl: { type: string, format: uri }
        apiPath: { type: string }
        hasApiKey: { type: boolean }
        modelName: { type: string }
        enabled: { type: boolean }
        temperature: { type: number }
        maxOutputTokens: { type: integer }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/ModelCapability' }
        updatedAt: { type: string, format: date-time }
    TransferOwnershipRequest:
      type: object
      required: [newOwnerId]
      properties:
        newOwnerId: { type: string, format: uuid }
    CreateInvitationRequest:
      type: object
      required: [role, expiresInHours]
      properties:
        role: { type: string, enum: [ADMIN, MEMBER] }
        invitedEmail: { type: [string, 'null'], format: email, maxLength: 120 }
        expiresInHours: { type: integer, minimum: 1, maximum: 168, default: 72 }
    InvitationView:
      type: object
      required: [id, code, projectId, role, expiresAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        projectId: { type: string, format: uuid }
        role: { type: string, enum: [ADMIN, MEMBER] }
        expiresAt: { type: string, format: date-time }
    InvitationPreview:
      type: object
      required: [projectId, projectName, role, expiresAt]
      properties:
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        role: { type: string, enum: [ADMIN, MEMBER] }
        invitedEmail: { type: [string, 'null'], format: email }
        expiresAt: { type: string, format: date-time }
    InvitationAcceptanceResult:
      type: object
      required: [projectId, projectName, role, alreadyMember]
      properties:
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        role: { $ref: '#/components/schemas/ProjectRole' }
        alreadyMember: { type: boolean }
    InvitationEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/InvitationView' }
    InvitationPreviewEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/InvitationPreview' }
    InvitationAcceptanceEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/InvitationAcceptanceResult' }
    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [ADMIN, MEMBER] }
    MilestoneStatus:
      type: string
      enum: [PLANNED, ACTIVE, COMPLETED, CANCELED]
    CreateMilestoneRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000, default: '' }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
        targetDate: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/MilestoneStatus' }
        sortOrder: { type: integer, minimum: 0 }
    UpdateMilestoneRequest:
      allOf:
        - $ref: '#/components/schemas/CreateMilestoneRequest'
        - type: object
          required: [status, sortOrder, version]
          properties:
            version: { type: integer, minimum: 0 }
    MilestoneView:
      type: object
      required: [id, projectId, name, description, status, sortOrder, version]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
        targetDate: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/MilestoneStatus' }
        sortOrder: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 0 }
    MilestoneEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/MilestoneView' }
    MilestoneListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/MilestoneView' }
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, BLOCKED, DONE, CANCELED]
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 4000, default: '' }
        milestoneId: { type: [string, 'null'], format: uuid }
        assigneeId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        estimateHours: { type: [number, 'null'], minimum: 0.5, maximum: 80 }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
    UpdateTaskRequest:
      type: object
      required: [version]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 4000 }
        milestoneId: { type: [string, 'null'], format: uuid }
        assigneeId: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        estimateHours: { type: [number, 'null'], minimum: 0.5, maximum: 80 }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        version: { type: integer, minimum: 0 }
      description: >
        OWNER/ADMIN must send title, status, priority and the complete editable task snapshot.
        MEMBER may send only status and version, and only for a task assigned to that member.
    TaskView:
      type: object
      required:
        [id, projectId, title, description, status, priority, version,
         unfinishedDependencyCount, dependencyIds]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        milestoneId: { type: [string, 'null'], format: uuid }
        milestoneName: { type: [string, 'null'] }
        assigneeId: { type: [string, 'null'], format: uuid }
        assigneeDisplayName: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        estimateHours: { type: [number, 'null'], minimum: 0.5, maximum: 80 }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        version: { type: integer, minimum: 0 }
        unfinishedDependencyCount: { type: integer, minimum: 0 }
        dependencyIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }
    TaskEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TaskView' }
    TaskListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/TaskView' }
    CommentRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
    CommentView:
      type: object
      required: [id, taskId, authorId, authorDisplayName, content, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorDisplayName: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CommentEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/CommentView' }
    CommentListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/CommentView' }
    DocumentStatus:
      type: string
      enum: [UPLOADED, PARSING, INDEXING, READY, FAILED, DELETING]
    DocumentView:
      type: object
      description: Safe document metadata. objectKey, extracted text, chunks, vectors, credentials, and server paths are intentionally absent.
      required: [id, projectId, displayName, originalFilename, mimeType, sizeBytes, status, chunkCount, uploadedById, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        displayName: { type: string }
        originalFilename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        parserType: { type: [string, 'null'] }
        chunkCount: { type: integer }
        embeddingProvider: { type: [string, 'null'] }
        embeddingModel: { type: [string, 'null'] }
        embeddingDimension: { type: [integer, 'null'] }
        errorMessage: { type: [string, 'null'] }
        uploadedById: { type: string, format: uuid }
        uploadedByDisplayName: { type: [string, 'null'] }
        indexedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DocumentEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/DocumentView' }
    DocumentListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/DocumentView' }
    DownloadUrlEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          properties:
            data:
              type: object
              required: [url, expiresAt]
              properties:
                url: { type: string, format: uri }
                expiresAt: { type: string, format: date-time }
    KnowledgeSessionView:
      type: object
      required: [id, projectId, title, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateKnowledgeSessionRequest:
      type: object
      properties:
        title:
          type: [string, 'null']
          maxLength: 120
    CitationView:
      type: object
      required: [documentId, filename, chunkId, heading, quote, similarity, rank]
      properties:
        documentId: { type: string, format: uuid }
        filename: { type: string }
        chunkId: { type: string, format: uuid }
        heading: { type: [string, 'null'] }
        quote: { type: string }
        similarity: { type: number, minimum: -1, maximum: 1 }
        rank: { type: integer, minimum: 1 }
    KnowledgeMessageView:
      type: object
      required: [id, role, content, insufficientEvidence, model, citations, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [USER, ASSISTANT] }
        content: { type: string }
        insufficientEvidence: { type: boolean }
        model: { type: [string, 'null'] }
        citations:
          type: array
          items: { $ref: '#/components/schemas/CitationView' }
        createdAt: { type: string, format: date-time }
    KnowledgeQuestionRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 1000 }
        documentIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
    KnowledgeAnswer:
      type: object
      required: [answer, insufficientEvidence, model, citations]
      properties:
        answer: { type: string }
        insufficientEvidence: { type: boolean }
        model: { type: [string, 'null'] }
        citations:
          type: array
          items: { $ref: '#/components/schemas/CitationView' }
    KnowledgeSessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/KnowledgeSessionView' }
    KnowledgeSessionListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/KnowledgeSessionView' }
    KnowledgeSessionDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [session, messages]
              properties:
                session: { $ref: '#/components/schemas/KnowledgeSessionView' }
                messages:
                  type: array
                  items: { $ref: '#/components/schemas/KnowledgeMessageView' }
    KnowledgeAnswerEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiMeta'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/KnowledgeAnswer' }
    GenerateTaskPlanRequest:
      type: object
      required: [title, goal, planStartDate, planDueDate, maxTaskCount]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        goal: { type: string, minLength: 1, maxLength: 2000 }
        planStartDate: { type: string, format: date }
        planDueDate: { type: string, format: date }
        maxTaskCount: { type: integer, enum: [10, 20, 30, 40], default: 20 }
        documentIds:
          type: array
          maxItems: 10
          uniqueItems: true
