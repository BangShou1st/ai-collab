    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [Documents]
      summary: Retry failed processing
      description: >
        OWNER and ADMIN only. PREPARING and ACTIVE projects are writable; COMPLETED and
        ARCHIVED return PROJECT_READ_ONLY. Resets the same FAILED document to UPLOADED and reuses its
