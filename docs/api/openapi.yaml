openapi: 3.1.0
info:
  title: AI Collab API
  version: 0.1.0
  description: Local-first collaboration platform with RAG knowledge QA and AI task planning.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Admin
  - name: Invitations
  - name: Projects
  - name: Members
  - name: Milestones
  - name: Tasks
  - name: Comments
  - name: Documents
  - name: Knowledge
  - name: TaskPlans
  - name: Dashboard
  - name: Audit
  - name: Agent Sessions
  - name: Agent Runs
  - name: Agent Approvals
  - name: Agent Skills
  - name: Agent Memories
  - name: Agent MCP
  - name: Notifications
  - name: Model Config
  - name: Embedding Config
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login
      description: |
        Public endpoint. Because a successful response sets the HttpOnly Refresh Cookie,
        the request must carry exactly one allowed Origin header. If Origin is absent,
        the server requires exactly one Referer and validates its origin. An untrusted,
        malformed, blank, repeated, or comma-joined source returns 403 before the
        request body reaches the controller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in; returns the Access Token and current user, and sets a new Refresh Cookie.
          headers:
            Set-Cookie:
              description: >
                ai_collab_refresh_token with Path=/api/v1/auth, HttpOnly,
                SameSite=Strict, Secure=false for local HTTP development,
                Secure=true by default in production, and Max-Age no longer
                than the server-side Refresh Token expiry.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '400':
          description: Login request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/registration-policy:
    get:
      tags: [Auth]
      security: []
      summary: Read public registration policy
      responses:
        '200':
          description: Current public registration switch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPolicyEnvelope'
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register a public account and create an authenticated session
      description: >
        Uses the same mandatory Origin/Referer validation, Access Token issuer,
        Refresh session implementation and Cookie settings as login. The endpoint
        returns REGISTRATION_DISABLED with HTTP 403 when public registration is off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered; returns the login response and sets a Refresh Cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '400':
          description: Registration request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Refresh access token using HttpOnly refresh cookie
      description: |
        Public endpoint that reads the Refresh Token only from the configured
        HttpOnly Cookie; an Access Token is neither required nor read. The
        request is subject to the same mandatory Origin/Referer validation as
        login. A successful refresh strictly rotates the submitted credential
        and sets its replacement Cookie.
      responses:
        '200':
          description: Refreshed; returns only a new Access Token and rotates the Refresh Cookie.
          headers:
            Set-Cookie:
              description: Replacement ai_collab_refresh_token with the configured security attributes.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout:
    post:
      tags: [Auth]
      security: []
      summary: Revoke the current Refresh Token session and clear its Cookie
      description: |
        Public and idempotent Cookie endpoint. It requires the same mandatory
        Origin/Referer validation as login and refresh, but does not require an
        Access Token. A missing, unknown, malformed, expired, or already revoked
        Refresh Cookie still returns 200 and clears the browser Cookie. An
        unexpected infrastructure failure returns 500, while the Cookie is
        still cleared.
      responses:
        '200':
          description: Logged out or already logged out
          headers:
            Set-Cookie:
              description: >
                Clears ai_collab_refresh_token using the configured Path,
                HttpOnly, SameSite and Secure attributes with Max-Age=0.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidResponseEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Unexpected server or persistence failure; the Cookie is still cleared
          headers:
            Set-Cookie:
              description: Clears ai_collab_refresh_token with Max-Age=0.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/me:
    patch:
      tags: [Auth]
      summary: Update current user's display name and email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentUserRequest'
      responses:
        '200':
          description: Safe current-user view without passwordHash or tokenVersion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Profile validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password and revoke every Refresh Token session
      description: >
        Increments token_version and revokes all Refresh sessions in one transaction.
        Already issued Access Tokens remain usable until their own expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed; clears the current browser Refresh Cookie
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoidResponseEnvelope' }
        '400':
          description: Current password invalid, same password, or validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Idempotently revoke all Refresh Token sessions for the current user
      responses:
        '200':
          description: All sessions revoked; clears the current browser Refresh Cookie
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoidResponseEnvelope' }
  /admin/test-users:
    post:
      tags: [Admin]
      summary: Create a test user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestUserRequest'
      responses:
        '201':
          description: Test user created
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      userId: { type: string, format: uuid }
        '400':
          description: Request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/users:
    get:
      tags: [Admin]
      summary: List local user accounts
      responses:
        '200':
          description: User list without password or token fields
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AdminUserView' }
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/models:
    get:
      tags: [Admin]
      summary: List model configurations
      responses:
        '200':
          description: API keys are never returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ModelConfigurationView' }
    post:
      tags: [Admin]
      summary: Create a model configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelConfigurationRequest' }
      responses:
        '201':
          description: Model configuration created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiMeta'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelConfigurationView' }
  /admin/models/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Admin]
      summary: Update a model configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelConfigurationRequest' }
      responses:
        '200':
          description: Model configuration updated
    delete:
      tags: [Admin]
      summary: Delete a model configuration
      responses:
        '204': { description: Deleted }
  /admin/models/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin]
      summary: Test a model connection
      responses:
        '200': { description: Provider response and normalized usage returned }
  /admin/models/assignments:
    get:
      tags: [Admin]
      summary: List purpose assignments
      responses:
        '200': { description: Purpose assignments }
  /admin/models/assignments/{purpose}:
    parameters:
      - name: purpose
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ModelPurpose' }
    put:
      tags: [Admin]
      summary: Assign an enabled configuration to a purpose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [configurationId]
              properties:
                configurationId: { type: string, format: uuid }
      responses:
        '204': { description: Assignment updated }
  /admin/users/{userId}/disable:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin]
      summary: Disable a user account
      responses:
        '204':
          description: User disabled
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/users/{userId}/enable:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin]
      summary: Enable a user account
      responses:
        '204':
          description: User enabled
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /invitations/{code}:
    get:
      tags: [Invitations]
      security: []
      summary: Preview invitation
      description: >
        Hashes the URL-safe invitation code with SHA-256 and performs a read-only lookup.
        The server never returns the stored hash and does not change invitation state.
      parameters:
        - $ref: '#/components/parameters/InvitationCode'
      responses:
        '200':
          description: Invitation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreviewEnvelope'
        '410':
          $ref: '#/components/responses/Gone'
  /invitations/{code}/accept:
    post:
      tags: [Invitations]
      security: []
      summary: Accept invitation and create account
      description: |
        Requires exactly one trusted Origin, or one Referer when Origin is absent.
        Locks the invitation row, creates the user and project membership, marks the
        invitation accepted, writes the audit record, and creates the Refresh session
        in one database transaction. The Set-Cookie header is added after that
        transaction returns. Concurrent acceptance succeeds at most once.
      parameters:
        - $ref: '#/components/parameters/InvitationCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '201':
          description: Account created and invitation accepted
          headers:
            Set-Cookie:
              description: HttpOnly Refresh Cookie with the same security attributes as login.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '400':
          description: Request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
  /invitations/{code}/accept-current-user:
    post:
      tags: [Invitations]
      summary: Accept invitation as the current user
      description: |
        Requires the global Bearer Access Token. It does not accept a request body,
        create an account, issue an Access Token, create a Refresh session, or set a
        Refresh Cookie. The user explicitly accepts after the read-only preview.
        Existing membership is returned without changing the role or consuming the invitation.
      parameters:
        - $ref: '#/components/parameters/InvitationCode'
      responses:
        '200':
          description: Invitation accepted or current membership confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptanceEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden, including an invitation email mismatch
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '410':
          $ref: '#/components/responses/Gone'
  /projects:
    get:
      tags: [Projects]
      summary: List current user's projects
      description: Uses one membership-scoped join; it does not issue one role query per project.
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '400':
          description: Project request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Get project
      description: >
        The project and current membership are selected together. A caller who is not a
        member receives PROJECT_NOT_FOUND, preventing project existence probing.
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Projects]
      summary: Update project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
        '400':
          description: Project request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Projects]
      summary: Delete project; owner only
      description: >
        Locks the project row and refuses deletion with PROJECT_DOCUMENTS_EXIST while any
        project_document row remains. The owner must delete every document first so MinIO
        objects cannot be orphaned by a database cascade.
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Project still contains documents (PROJECT_DOCUMENTS_EXIST)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Members]
      summary: List members
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/invitations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Members]
      summary: Create invitation
      description: >
        OWNER and ADMIN only. Generates 32 random bytes with SecureRandom, returns the
        unpadded URL-safe Base64 code once, and stores only its SHA-256 digest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationEnvelope'
        '400':
          description: Invitation request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/members/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Members]
      summary: Change member role; owner only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: Role changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberEnvelope'
        '400':
          description: Role request validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Members]
      summary: Remove member; owner only
      responses:
        '204':
          description: Removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/leave:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Members]
      summary: Leave project (current user cannot be owner)
      responses:
        '204':
          description: Left project
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Members]
      summary: Transfer project ownership (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '204':
          description: Ownership transferred
        '400':
          description: Invalid request, including transfer to the current owner
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Project is not visible or the target user is no longer a project member
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Ownership changed concurrently; retry with current project state
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /projects/{projectId}/milestones:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Milestones]
      summary: List milestones
      responses:
        '200':
          description: Milestone list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneListEnvelope'
    post:
      tags: [Milestones]
      summary: Create milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMilestoneRequest'
      responses:
        '201':
          description: Milestone created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneEnvelope'
  /projects/{projectId}/milestones/{milestoneId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/MilestoneId'
    patch:
      tags: [Milestones]
      summary: Update milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMilestoneRequest'
      responses:
        '200':
          description: Milestone updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneEnvelope'
    delete:
      tags: [Milestones]
      summary: Delete milestone
      responses:
        '204':
          description: Deleted
  /projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tasks]
      summary: List tasks
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
        - name: milestoneId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListEnvelope'
    post:
      tags: [Tasks]
      summary: Create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
  /projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get task
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
    patch:
      tags: [Tasks]
      summary: Update task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Tasks]
      summary: Delete task
      responses:
        '204':
          description: Deleted
