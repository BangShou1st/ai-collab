[project]
name = "ai-collab-ai-worker"
version = "0.1.0"
description = "AI Collab Python 认知面（P0 骨架）：PromptPack、跨语言契约与离线评测"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "AI Collab" }]
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "prometheus-client>=0.21,<1",
  "structlog>=24.4,<26",
  "uvicorn>=0.32,<1",
]

[project.scripts]
ai-eval = "ai_collab_worker.eval.cli:main"
ai-prompts = "ai_collab_worker.prompts.build:main"

[dependency-groups]
dev = [
  "hypothesis>=6.115,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_collab_worker"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "C4",
  "SIM",
  "RUF",
  "ARG",
  "DTZ",
  "LOG",
  "PIE",
  "PT",
  "RET",
  "TID",
]
# B008：FastAPI 的 Depends()/Query() 必须在默认参数位置求值。
# RUF001-003：中文正文里的全角标点是刻意保留的排版，不是拼写歧义。
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_configs = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
