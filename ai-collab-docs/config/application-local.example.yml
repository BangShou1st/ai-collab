spring:
  application:
    name: ai-collab-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:ai_collab}
    username: ${POSTGRES_USER:ai_collab}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 2h
    refresh-token-ttl: 7d

storage:
  minio:
    endpoint: http://localhost:9000
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: ${MINIO_BUCKET:ai-collab}
    presigned-download-ttl: 5m

document:
  max-size-bytes: 20971520
  parse-timeout: 60s
  max-extracted-characters: 2000000
  chunk:
    target-characters: 800
    max-characters: 1200
    overlap-characters: 120

ai:
  chat:
    provider: ${AI_CHAT_PROVIDER}
    base-url: ${AI_CHAT_BASE_URL}
    api-key: ${AI_CHAT_API_KEY}
    model: ${AI_CHAT_MODEL}
    connect-timeout: 10s
    read-timeout: 90s
  embedding:
    provider: ${AI_EMBEDDING_PROVIDER}
    base-url: ${AI_EMBEDDING_BASE_URL}
    api-key: ${AI_EMBEDDING_API_KEY}
    model: ${AI_EMBEDDING_MODEL}
    dimension: ${AI_EMBEDDING_DIMENSION:1024}
    connect-timeout: 10s
    read-timeout: 60s
  rag:
    top-k: 8
    max-context-chunks: 5
    similarity-threshold: 0.55
    max-context-characters: 8000
  rate-limit:
    knowledge-per-user-per-hour: 30
    planning-per-user-per-hour: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.shitulelv.aicollab: DEBUG
