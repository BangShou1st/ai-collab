# 测试类路径专用覆盖（叠加在主 application.yml 之上，仅影响测试）：
# - 关闭独立管理端口（-1 = DISABLED）：真实服务器测试（RANDOM_PORT/DEFINED_PORT）
#   若固定绑定 8081 会在多个缓存的测试上下文之间互相争抢端口；端口隔离契约本身
#   由 ObservabilityContractTest 对 application.yml 的静态断言与 compose 契约脚本覆盖。
# - 关闭 trace 导出：避免 OTLP 后台导出向不可达的 http://tempo:4317 反复重试产生噪音。
# - 显式关闭各链路 MQ 总闸（M1 文档 / M2 agent 与规划）：默认即 false，这里显式声明
#   防止未来默认值翻转导致普通测试依赖 broker；MQ 集成测试（Testcontainers）在
#   自己的配置中单独开启。
management.server.port=-1
management.tracing.enabled=false
document.mq.enabled=false
agent.mq.enabled=false
planning.mq.enabled=false

# P2-B2 Lane C 最小缓解：本机 Docker VM 仅 1.86GiB，而 Surefire 单 fork 会缓存多个
# Spring TestContext；每个上下文默认 Hikari max=10，叠加大量独立 PostgreSQL
# Testcontainers 后会出现 CannotGetJdbcConnectionException。这里只收敛测试资源，
# 不改变生产配置：降低每个缓存上下文的连接上限，并限制上下文缓存数量。
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.test.context.cache.maxSize=12
