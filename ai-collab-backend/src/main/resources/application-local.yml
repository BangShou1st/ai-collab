spring:
  config:
    import: "file:../.env[.properties]"

  datasource:
    url: "jdbc:postgresql://localhost:5432/${POSTGRES_DB:ai_collab}"
    username: "${POSTGRES_USER:ai_collab}"
    password: "${POSTGRES_PASSWORD}"
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: AiCollabHikariPool
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      password: "${REDIS_PASSWORD}"
      timeout: 3s

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

server:
  port: 8080

storage:
  minio:
    endpoint: "${MINIO_ENDPOINT:http://localhost:9000}"
    access-key: "${MINIO_ACCESS_KEY:${MINIO_ROOT_USER}}"
    secret-key: "${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD}}"
    bucket: "${MINIO_BUCKET:ai-collab}"

embedding:
  enabled: "${EMBEDDING_ENABLED:false}"
  provider: "${EMBEDDING_PROVIDER:openai-compatible}"
  base-url: "${EMBEDDING_BASE_URL:}"
  path: "${EMBEDDING_PATH:/v1/embeddings}"
  api-key: "${EMBEDDING_API_KEY:}"
  model: "${EMBEDDING_MODEL:}"
  dimensions: "${EMBEDDING_DIMENSIONS:1536}"
  batch-size: "${EMBEDDING_BATCH_SIZE:16}"
  connect-timeout: "${EMBEDDING_CONNECT_TIMEOUT:5s}"
  read-timeout: "${EMBEDDING_READ_TIMEOUT:60s}"

chat:
  enabled: "${CHAT_ENABLED:false}"
  provider: "${CHAT_PROVIDER:openai-compatible}"
  base-url: "${CHAT_BASE_URL:}"
  path: "${CHAT_PATH:/v1/chat/completions}"
  api-key: "${CHAT_API_KEY:}"
  model: "${CHAT_MODEL:}"
  connect-timeout: "${CHAT_CONNECT_TIMEOUT:5s}"
  read-timeout: "${CHAT_READ_TIMEOUT:60s}"
  temperature: "${CHAT_TEMPERATURE:0.2}"
  max-output-tokens: "${CHAT_MAX_OUTPUT_TOKENS:1200}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.shitulelv.aicollab: DEBUG
    # MyBatis 在 DEBUG 下会输出 SQL 参数；用户表参数可能包含 password_hash，必须单独关闭。
    com.shitulelv.aicollab.user.mapper: INFO
    # Refresh Token Mapper 的参数包含 token_hash；本地开发也不得输出完整摘要。
    com.shitulelv.aicollab.auth.refresh.mapper: INFO
    # 文档 Mapper 参数可能包含分块正文、metadata 和完整向量，本地环境也禁止输出。
    com.shitulelv.aicollab.document.infrastructure.mapper: INFO
    com.shitulelv.aicollab.knowledge.infrastructure.mapper: INFO

security:
  jwt:
    secret: "${JWT_SECRET}"
    access-token-minutes: "${JWT_ACCESS_TOKEN_MINUTES:30}"
  refresh-token:
    token-lifetime: "${REFRESH_TOKEN_LIFETIME:14d}"
    session-lifetime: "${REFRESH_SESSION_LIFETIME:30d}"
    cookie-name: ai_collab_refresh_token
    cookie-path: /api/v1/auth
    same-site: Strict
    cookie-secure: "${REFRESH_COOKIE_SECURE:false}"
  cors:
    allowed-origins: "${AUTH_ALLOWED_ORIGINS:http://localhost:5173}"

demo:
  owner:
    username: "${DEMO_OWNER_USERNAME:owner}"
    password: "${DEMO_OWNER_PASSWORD}"

auth:
  public-registration:
    enabled: "${AUTH_PUBLIC_REGISTRATION_ENABLED:false}"
