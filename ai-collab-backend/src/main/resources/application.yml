spring:
    application:
        name: ai-collab-backend
    servlet:
        multipart:
            max-file-size: 20MB
            max-request-size: 22MB

storage:
    minio:
        endpoint: "${MINIO_ENDPOINT:http://localhost:9000}"
        access-key: "${MINIO_ACCESS_KEY:}"
        secret-key: "${MINIO_SECRET_KEY:}"
        bucket: "${MINIO_BUCKET:ai-collab}"

embedding:
    enabled: "${EMBEDDING_ENABLED:false}"
    provider: "${EMBEDDING_PROVIDER:openai-compatible}"
    base-url: "${EMBEDDING_BASE_URL:}"
    path: "${EMBEDDING_PATH:/v1/embeddings}"
    api-key: "${EMBEDDING_API_KEY:}"
    model: "${EMBEDDING_MODEL:}"
    dimensions: "${EMBEDDING_DIMENSIONS:1536}"
    batch-size: "${EMBEDDING_BATCH_SIZE:16}"
    connect-timeout: "${EMBEDDING_CONNECT_TIMEOUT:5s}"
    read-timeout: "${EMBEDDING_READ_TIMEOUT:60s}"

chat:
    enabled: "${CHAT_ENABLED:false}"
    provider: "${CHAT_PROVIDER:openai-compatible}"
    base-url: "${CHAT_BASE_URL:}"
    path: "${CHAT_PATH:/v1/chat/completions}"
    api-key: "${CHAT_API_KEY:}"
    model: "${CHAT_MODEL:}"
    connect-timeout: "${CHAT_CONNECT_TIMEOUT:5s}"
    read-timeout: "${CHAT_READ_TIMEOUT:60s}"
    temperature: "${CHAT_TEMPERATURE:0.2}"
    max-output-tokens: "${CHAT_MAX_OUTPUT_TOKENS:1200}"
    json-mode-enabled: "${CHAT_JSON_MODE_ENABLED:true}"

planning:
    enabled: "${PLANNING_ENABLED:${CHAT_ENABLED:false}}"
    provider: "${PLANNING_PROVIDER:${CHAT_PROVIDER:openai-compatible}}"
    base-url: "${PLANNING_BASE_URL:${CHAT_BASE_URL:}}"
    path: "${PLANNING_PATH:${CHAT_PATH:/v1/chat/completions}}"
    api-key: "${PLANNING_API_KEY:${CHAT_API_KEY:}}"
    model: "${PLANNING_MODEL:${CHAT_MODEL:}}"
    connect-timeout: "${PLANNING_CONNECT_TIMEOUT:${CHAT_CONNECT_TIMEOUT:5s}}"
    read-timeout: "${PLANNING_READ_TIMEOUT:${CHAT_READ_TIMEOUT:120s}}"
    temperature: "${PLANNING_TEMPERATURE:${CHAT_TEMPERATURE:0.2}}"
    max-output-tokens: "${PLANNING_MAX_OUTPUT_TOKENS:6000}"
    max-sources: "${PLANNING_MAX_SOURCES:12}"
    source-codepoint-budget: "${PLANNING_SOURCE_CODEPOINT_BUDGET:16000}"
    retrieval-threshold: "${PLANNING_RETRIEVAL_THRESHOLD:0.55}"
    generation-limit-per-user-hour: "${PLANNING_GENERATION_LIMIT_PER_USER_HOUR:10}"
    executor:
        core-size: "${PLANNING_EXECUTOR_CORE_SIZE:2}"
        max-size: "${PLANNING_EXECUTOR_MAX_SIZE:4}"
        queue-capacity: "${PLANNING_EXECUTOR_QUEUE_CAPACITY:20}"

mybatis-plus:
    type-handlers-package: com.shitulelv.aicollab.common.persistence

security:
    refresh-token:
        cookie-secure: "${REFRESH_COOKIE_SECURE:true}"

auth:
    public-registration:
        enabled: "${AUTH_PUBLIC_REGISTRATION_ENABLED:false}"
