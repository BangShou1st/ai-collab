spring:
    application:
        name: ai-collab-backend
    servlet:
        multipart:
            max-file-size: 20MB
            max-request-size: 22MB

storage:
    minio:
        endpoint: "${MINIO_ENDPOINT:http://localhost:9000}"
        access-key: "${MINIO_ACCESS_KEY:}"
        secret-key: "${MINIO_SECRET_KEY:}"
        bucket: "${MINIO_BUCKET:ai-collab}"

embedding:
    local-allowed-targets: "${EMBEDDING_LOCAL_ALLOWED_TARGETS:127.0.0.1:11434,localhost:11434,[::1]:11434}"
    enabled: "${EMBEDDING_ENABLED:false}"
    provider: "${EMBEDDING_PROVIDER:OPENAI_COMPATIBLE}"
    base-url: "${EMBEDDING_BASE_URL:}"
    path: "${EMBEDDING_PATH:/v1/embeddings}"
    api-key: "${EMBEDDING_API_KEY:}"
    model: "${EMBEDDING_MODEL:}"
    dimensions: "${EMBEDDING_DIMENSIONS:1536}"
    batch-size: "${EMBEDDING_BATCH_SIZE:16}"
    connect-timeout: "${EMBEDDING_CONNECT_TIMEOUT:5s}"
    read-timeout: "${EMBEDDING_READ_TIMEOUT:60s}"

chat:
    enabled: "${CHAT_ENABLED:false}"
    provider: "${CHAT_PROVIDER:openai-compatible}"
    base-url: "${CHAT_BASE_URL:}"
    path: "${CHAT_PATH:/v1/chat/completions}"
    api-key: "${CHAT_API_KEY:}"
    model: "${CHAT_MODEL:}"
    connect-timeout: "${CHAT_CONNECT_TIMEOUT:5s}"
    read-timeout: "${CHAT_READ_TIMEOUT:60s}"
    temperature: "${CHAT_TEMPERATURE:0.2}"
    max-output-tokens: "${CHAT_MAX_OUTPUT_TOKENS:1200}"
    json-mode-enabled: "${CHAT_JSON_MODE_ENABLED:true}"

planning:
    enabled: "${PLANNING_ENABLED:${CHAT_ENABLED:false}}"
    provider: "${PLANNING_PROVIDER:${CHAT_PROVIDER:openai-compatible}}"
    base-url: "${PLANNING_BASE_URL:${CHAT_BASE_URL:}}"
    path: "${PLANNING_PATH:${CHAT_PATH:/v1/chat/completions}}"
    api-key: "${PLANNING_API_KEY:${CHAT_API_KEY:}}"
    model: "${PLANNING_MODEL:${CHAT_MODEL:}}"
    connect-timeout: "${PLANNING_CONNECT_TIMEOUT:${CHAT_CONNECT_TIMEOUT:5s}}"
    read-timeout: "${PLANNING_READ_TIMEOUT:${CHAT_READ_TIMEOUT:120s}}"
    temperature: "${PLANNING_TEMPERATURE:${CHAT_TEMPERATURE:0.2}}"
    max-output-tokens: "${PLANNING_MAX_OUTPUT_TOKENS:6000}"
    max-sources: "${PLANNING_MAX_SOURCES:12}"
    source-codepoint-budget: "${PLANNING_SOURCE_CODEPOINT_BUDGET:16000}"
    retrieval-threshold: "${PLANNING_RETRIEVAL_THRESHOLD:0.55}"
    generation-limit-per-user-hour: "${PLANNING_GENERATION_LIMIT_PER_USER_HOUR:60}"
    executor:
        core-size: "${PLANNING_EXECUTOR_CORE_SIZE:2}"
        max-size: "${PLANNING_EXECUTOR_MAX_SIZE:4}"
        queue-capacity: "${PLANNING_EXECUTOR_QUEUE_CAPACITY:20}"

mybatis-plus:
    type-handlers-package: com.shitulelv.aicollab.common.persistence

security:
    refresh-token:
        cookie-secure: "${REFRESH_COOKIE_SECURE:true}"

auth:
    public-registration:
        enabled: "${AUTH_PUBLIC_REGISTRATION_ENABLED:false}"
knowledge:
  rate-limit-per-user-hour: "${KNOWLEDGE_RATE_LIMIT_PER_USER_HOUR:60}"

zen:
  # Zen 上游 base。取值必须命中代码白名单（ProviderPresetRegistry.APPROVED_ZEN_BASES）：
  # 白名单只含共享库声明的推理 base（https://opencode.ai/inference/v1）。
  # 推理路径（/chat/completions）与模型发现路径（/models）由共享库常量固定，不能来自此处的配置、
  # 用户请求、HTTP Header 或模型响应；旧版 /zen/v1 只允许发现、不允许推理，故不可选为上游。
  upstream: "${OPENCODE_ZEN_UPSTREAM:https://opencode.ai/inference/v1}"

# User-Agent 不在此处重复声明：共享库 OpenCodeZenProperties 的默认值即已验证取值，
# ProviderPresetRegistry 缺省时同样取该常量。如需覆盖，设置环境变量 OPENCODE_ZEN_USER_AGENT。
agent:
  enabled: ${AGENT_ENABLED:${CHAT_ENABLED:false}}
  worker-delay-ms: ${AGENT_WORKER_DELAY_MS:1000}
  schedule-delay-ms: ${AGENT_SCHEDULE_DELAY_MS:30000}
  # Agent Worker 执行器并发数（取值 1-4，越界启动失败）：耗时的模型轮次与工具执行在独立线程池中运行，
  # 满载时本轮 tick 直接放弃派发，不排队、不阻塞调度线程，由数据库租约与恢复机制接管。
  worker-concurrency: ${AGENT_WORKER_CONCURRENCY:2}
  context:
    # 上下文组装与单次请求预算；composer-v2=false 回退到固定条数/字符截断的旧组装路径
    composer-v2: "${AGENT_CONTEXT_COMPOSER_V2:true}"
    # 应用单次输入上限（token）；模型窗口未知时的保守应用上限
    per-request-input-cap: "${AGENT_CONTEXT_PER_REQUEST_INPUT_CAP:50000}"
    # 输出预留与安全余量（token），仅在模型窗口已知时参与计算
    output-reserve-tokens: "${AGENT_CONTEXT_OUTPUT_RESERVE_TOKENS:8000}"
    safety-margin-tokens: "${AGENT_CONTEXT_SAFETY_MARGIN_TOKENS:2000}"
    # 模型上下文窗口覆盖，键为 "提供商类型:模型名" 或 "模型名"，值 token；未匹配视为未知
    # window-overrides:
    #   "OPENAI_COMPATIBLE:gpt-4o": 128000
  mcp:
    allowed-hosts: "${AGENT_MCP_ALLOWED_HOSTS:}"

model:
  config:
    master-key: "${MODEL_CONFIG_MASTER_KEY:}"
