name: CI

# PR 面向 main 与 dev 都触发（开发分支改动同样需要回归）；
# main 与 dev 自身 push 触发；workflow_dispatch 供手动复跑。
# 不使用 pull_request_target：本流水线会检出并执行提交内的构建脚本与测试。
on:
  push:
    branches: [main, dev]
    # 受控版本标签触发发布（release job 仅响应 v* 标签）。
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 最小权限：只读仓库内容；共享库通过公开 JitPack 解析。
permissions:
  contents: read

# 同一 PR 的旧运行可取消；main 上的运行不互相取消，避免丢失主干验证结果。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-contract:
    name: P0 production configuration and backup contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate production configuration and failure paths
        run: |
          docker compose --env-file ai-collab-deploy/prod.env.example -f ai-collab-deploy/compose.prod.yml config --format json | node ai-collab-deploy/scripts/prod-compose-contract.mjs
          AUTH_PUBLIC_REGISTRATION_ENABLED=false docker compose --env-file ai-collab-deploy/prod.env.example -f ai-collab-deploy/compose.prod.yml config --format json | P0_EXPECT_REGISTRATION=false node ai-collab-deploy/scripts/prod-compose-contract.mjs
          node --test ai-collab-deploy/scripts/prod-config-check.test.mjs
          bash ai-collab-deploy/scripts/backup-safety-contract.sh

      - name: Validate local one-click compose contract
        run: |
          cat > local-contract.env <<'EOF'
          APP_IMAGE=ci/synthetic-backend:contract
          WEB_IMAGE=ci/synthetic-frontend:contract
          HTTP_PORT=8080
          POSTGRES_DB=ai_collab
          POSTGRES_USER=ai_collab
          POSTGRES_PASSWORD=ci-synthetic-postgres-password
          REDIS_PASSWORD=ci-synthetic-redis-password
          MINIO_ROOT_USER=ci-admin
          MINIO_ROOT_PASSWORD=ci-synthetic-minio-password
          MINIO_BUCKET=ai-collab
          JWT_SECRET=ci-synthetic-jwt-secret-0123456789abcdef0123456789abcdef
          MODEL_CONFIG_MASTER_KEY=0123456789abcdef0123456789abcdef
          EOF
          docker compose --env-file local-contract.env -f ai-collab-deploy/compose.local.yml config --format json | node ai-collab-deploy/scripts/local-compose-contract.mjs

      - name: Assert install scripts match GHCR publish targets
        run: |
          # 安装脚本的默认镜像引用必须与 release job 的发布目标一致（ghcr.io/<owner>/<repo>/<image>，
          # 全小写）；release job 在运行时还会用本仓库实际路径再次校验并执行标签推导测试。
          grep -q 'GHCR_BACKEND="ghcr.io/bangshou1st/ai-collab/ai-collab-backend"' ai-collab-deploy/install.sh
          grep -q 'GHCR_FRONTEND="ghcr.io/bangshou1st/ai-collab/ai-collab-frontend"' ai-collab-deploy/install.sh
          grep -q 'ghcr.io/bangshou1st/ai-collab/ai-collab-backend' ai-collab-deploy/install.ps1
          grep -q 'ghcr.io/bangshou1st/ai-collab/ai-collab-frontend' ai-collab-deploy/install.ps1
          echo "install/publish GHCR targets consistent"
          # 发布标签推导与小写化测试（与 release job 共用同一实现）。
          bash ai-collab-deploy/scripts/release-tags.test.sh

  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ai-collab-backend
    steps:
      - uses: actions/checkout@v4

      # Testcontainers 用例在无 Docker 时会被静默跳过，先确认守护进程可用。
      - name: Check Docker availability
        working-directory: .
        run: docker info

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ai-collab-backend/pom.xml

      # 仓库中 mvnw 的 Git 权限位是 100644，用 bash 显式调用以避开执行位问题。
      - name: Build & verify (Testcontainers + Flyway)
        run: bash ./mvnw -B -ntp verify

      # verify 成功不等于容器用例真的跑过：逐类核对关键 Testcontainers 用例的
      # Surefire 统计，整类被跳过时判定失败，不把"全跳过"当成通过。
      - name: Assert container tests actually ran
        if: success()
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          # 覆盖上下文压缩、Flyway 迁移与运行恢复的关键真实 PostgreSQL 用例。
          # RetrievalCoveragePostgresTest 是 D-RAG-01A 的检索覆盖基线：用真实 pgvector
          # 观察向量候选与上下文保留；整类被跳过时同样判失败。
          # RetrievalQualityHardGatePostgresTest 是 D-RAG-01C 第二轮的确定性质量硬门槛，
          # AgentResearchQualityPostgresTest 是直接研究/委派同题对照（真实 PostgreSQL + 真实工具），
          # 两者都必须真实执行，不得整类跳过（真实 Ollama 门槛为 Opt-in，不在此列）。
          # KiloGatewayPresetIsolationIntegrationTest 验证 V65 迁移与双预设隔离：同样不得整类跳过。
          required = [
              "com.shitulelv.aicollab.agent.infrastructure.diagnostics.AgentObservabilityPostgresTest",
              "com.shitulelv.aicollab.agent.infrastructure.diagnostics.AgentRuntimeMetricsTest",
              "com.shitulelv.aicollab.agent.infrastructure.diagnostics.AgentActuatorSecurityTest",
              "com.shitulelv.aicollab.agent.infrastructure.diagnostics.AgentModelTransportMetricsTest",
              "com.shitulelv.aicollab.agent.application.runtime.AgentRemoteOutcomePostgresTest",
              "com.shitulelv.aicollab.agent.application.runtime.AgentRemoteOutcomeMigrationPostgresTest",
              "com.shitulelv.aicollab.agent.application.runtime.AgentToolSchedulerTest",
              "com.shitulelv.aicollab.agent.application.runtime.AgentPauseResumePostgresTest",
              "com.shitulelv.aicollab.agent.application.runtime.PersistedModelTurnRecoveryPostgresTest",
              "com.shitulelv.aicollab.acceptance.LegacyApprovalCitationUpgradeTest",
              "com.shitulelv.aicollab.agent.application.runtime.AgentRunContextCommitPostgresTest",
              "com.shitulelv.aicollab.agent.application.AgentRunRetryPostgresIntegrationTest",
              "com.shitulelv.aicollab.agent.infrastructure.AgentMigrationIntegrationTest",
              "com.shitulelv.aicollab.acceptance.NextStageMigrationPostgresTest",
              "com.shitulelv.aicollab.retrieval.RetrievalCoveragePostgresTest",
              "com.shitulelv.aicollab.retrieval.RetrievalQualityHardGatePostgresTest",
              "com.shitulelv.aicollab.agent.application.runtime.AgentDelegationPostgresTest",
              "com.shitulelv.aicollab.agent.infrastructure.tool.AgentResearchQualityPostgresTest",
              "com.shitulelv.aicollab.agent.infrastructure.repository.AgentFinalCitationContractPostgresTest",
              "com.shitulelv.aicollab.infrastructure.ai.user.KiloGatewayPresetIsolationIntegrationTest",
              "com.shitulelv.aicollab.notification.NotificationNavigationPostgresTest",
          ]

          stats = {}
          for path in glob.glob("target/surefire-reports/TEST-*.xml"):
              root = ET.parse(path).getroot()
              stats[root.get("name")] = {
                  key: int(root.get(key, 0))
                  for key in ("tests", "failures", "errors", "skipped")
              }

          total = sum(item["tests"] for item in stats.values())
          skipped = sum(item["skipped"] for item in stats.values())
          print(
              f"Surefire: {total} tests, {skipped} skipped, "
              f"{len(stats)} test classes reported"
          )

          problems = []
          for name in required:
              item = stats.get(name)
              if item is None:
                  problems.append(f"{name}: no Surefire report (class did not run)")
              elif item["tests"] == 0:
                  problems.append(f"{name}: recorded 0 tests")
              elif item["skipped"] == item["tests"]:
                  problems.append(
                      f"{name}: all {item['tests']} tests skipped — "
                      "container runtime unavailable?"
                  )

          # Local Ollama experiments must stay explicitly opt-in; a superclass
          # EnabledIfEnvironmentVariable does not gate a concrete subclass.
          for name in [
              "com.shitulelv.aicollab.retrieval.P6RagQualityBaselinePostgresTest",
              "com.shitulelv.aicollab.retrieval.P8AgentRagCrossLayerPostgresTest",
              "com.shitulelv.aicollab.retrieval.P8RagQualityFixExperimentPostgresTest",
          ]:
              item = stats.get(name)
              if item is None or item["tests"] == 0 or item["skipped"] != item["tests"]:
                  problems.append(f"{name}: local-model opt-in guard did not skip the class")

          if problems:
              print("Container test guard FAILED:", file=sys.stderr)
              for problem in problems:
                  print(f"  - {problem}", file=sys.stderr)
              sys.exit(1)
          print("Container test guard passed for all required classes.")
          PY

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: ai-collab-backend/target/surefire-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: ai-collab-backend/target/site/jacoco/
          retention-days: 14
          if-no-files-found: warn

  frontend:
    name: Frontend (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai-collab-frontend
    steps:
      - uses: actions/checkout@v4

      # 版本与 ai-collab-frontend/package.json 的 packageManager（pnpm@11.9.0）精确对齐。
      - name: Install pnpm 11.9.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          package_json_file: ai-collab-frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ai-collab-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # 镜像构建与容器级冒烟：验证 Dockerfile 路径真实可用（不推送到任何仓库，
  # 镜像仅存在于本次 runner）。PR、main 与版本标签 push 触发（tag 触发时
  # release job 依赖本 job，必须真实执行而不是跳过）。
  image:
    name: Image build & container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: |
          docker compose --env-file .env.example -f ai-collab-deploy/docker-compose.yml config -q
          # P5-DEPLOYMENT-GATE-01：配置契约回归（仅渲染配置，不启动容器、全合成值）
          bash ai-collab-deploy/scripts/compose-config-contract.sh

      - name: Build backend image
        run: |
          docker build \
            -f ai-collab-backend/Dockerfile \
            -t ai-collab-backend:rc-${GITHUB_SHA::12} \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            --label org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} \
            .

      - name: Boot container with dependencies and smoke test
        run: |
          docker network create smoke
          docker run -d --name smoke-pg --network smoke \
            -e POSTGRES_DB=ai_collab -e POSTGRES_USER=smoke -e POSTGRES_PASSWORD=smoke-only \
            pgvector/pgvector:pg17 >/dev/null
          docker run -d --name smoke-redis --network smoke redis:7-alpine \
            redis-server --requirepass smoke-only >/dev/null
          docker run -d --name smoke-minio --network smoke -v smoke-minio-data:/data \
            -e MINIO_ROOT_USER=smoke -e MINIO_ROOT_PASSWORD=smoke-only-minio \
            cgr.dev/chainguard/minio:latest@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18 \
            server /data >/dev/null
          docker run -d --name smoke-app --network smoke -p 8080:8080 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://smoke-pg:5432/ai_collab \
            -e SPRING_DATASOURCE_USERNAME=smoke \
            -e SPRING_DATASOURCE_PASSWORD=smoke-only \
            -e SPRING_DATA_REDIS_HOST=smoke-redis \
            -e SPRING_DATA_REDIS_PASSWORD=smoke-only \
            -e MINIO_ENDPOINT=http://smoke-minio:9000 \
            -e MINIO_ACCESS_KEY=smoke \
            -e MINIO_SECRET_KEY=smoke-only-minio \
            -e MINIO_BUCKET=ai-collab \
            -e JWT_SECRET=smoke-only-secret-at-least-32-bytes-long!! \
            -e MODEL_CONFIG_MASTER_KEY=0123456789abcdef0123456789abcdef \
            -e REFRESH_COOKIE_SECURE=true \
            ai-collab-backend:rc-${GITHUB_SHA::12} >/dev/null

          # 就绪等待（Flyway 迁移 + Spring 启动，上限 120s）
          for i in $(seq 1 60); do
            status=$(docker exec smoke-app wget -qO- http://127.0.0.1:8080/actuator/health 2>/dev/null || true)
            echo "$status" | grep -q '"UP"' && break
            [ "$i" = 60 ] && { docker logs --tail 80 smoke-app; exit 1; }
            sleep 2
          done

          # 健康与存活探针必须 UP；敏感与非暴露端点必须拒绝匿名访问。
          curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"UP"'
          curl -fsS http://127.0.0.1:8080/actuator/health/liveness | grep -q '"UP"'
          code_env=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/actuator/env)
          code_metrics=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/actuator/metrics)
          code_info=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/actuator/info)
          echo "actuator/env=$code_env actuator/metrics=$code_metrics actuator/info=$code_info"
          [ "$code_env" != "200" ] && [ "$code_metrics" != "200" ] && [ "$code_info" != "200" ]

          # 版本可追踪：镜像 revision 标签必须等于本次构建的 commit。
          rev=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' ai-collab-backend:rc-${GITHUB_SHA::12})
          [ "$rev" = "$GITHUB_SHA" ]

      - name: Isolated production topology and recovery
        run: |
          docker tag ai-collab-backend:rc-${GITHUB_SHA::12} ai-collab-p0-isolated:dirty
          docker pull node:24.14.0-alpine
          bash ai-collab-deploy/scripts/p0-isolated-compose-smoke.sh

  # 受控发布：仅 main push / 版本标签 / 手动触发发布镜像到 GHCR；
  # PR 一律不发布。记录源码 SHA 与镜像 Digest，禁止浮动 latest 作为唯一发布依据
  # （latest 标签仅作为本地安装的便捷默认值，验收以 digest 为准）。
  release:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [production-contract, backend, frontend, image]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR 镜像路径必须全小写：github.repository 保留原始大小写（BangShou1st/ai-collab），
      # 直接拼接会触发 "repository name must be lowercase"。此处统一转小写，
      # 并要求与安装脚本（install.sh/install.ps1）常量逐字一致。
      - name: Compute lowercase image base
        id: image-base
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "backend=${base}/ai-collab-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${base}/ai-collab-frontend" >> "$GITHUB_OUTPUT"
          if [ "$base" != "ghcr.io/bangshou1st/ai-collab" ]; then
            echo "ERROR: install 脚本内的 GHCR 常量为 bangshou1st/ai-collab，与本仓库不一致" >&2
            exit 1
          fi
          grep -q 'GHCR_BACKEND="ghcr.io/bangshou1st/ai-collab/ai-collab-backend"' ai-collab-deploy/install.sh
          grep -q 'GHCR_FRONTEND="ghcr.io/bangshou1st/ai-collab/ai-collab-frontend"' ai-collab-deploy/install.sh
          grep -q 'ghcr.io/bangshou1st/ai-collab/ai-collab-backend' ai-collab-deploy/install.ps1
          grep -q 'ghcr.io/bangshou1st/ai-collab/ai-collab-frontend' ai-collab-deploy/install.ps1
          echo "install/publish GHCR targets consistent"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签策略（实现单一来源 ai-collab-deploy/scripts/release-tags.sh，
      # 与 scripts/release-tags.test.sh 共享同一份推导逻辑）：
      # main 构建 -> sha-<short>、main 与 latest（latest 仅作本地安装的便捷默认值，
      # 验收追溯以 sha-<short> 或 digest 为准）；版本标签 -> v<版本> 与 sha-<short>。
      - name: Derive image tags
        id: tags
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          base_be="${{ steps.image-base.outputs.backend }}"
          base_fe="${{ steps.image-base.outputs.frontend }}"
          read -r backend_tags frontend_tags < <(bash ai-collab-deploy/scripts/release-tags.sh "$GITHUB_REF" "${GITHUB_SHA::12}")
          join_tags() {
            local base="$1" list="$2" out="" t
            local old_ifs="$IFS"; IFS=','
            for t in $list; do out="${out}${base}:${t},"; done
            IFS="$old_ifs"
            printf '%s' "${out%,}"
          }
          echo "backend=$(join_tags "$base_be" "$backend_tags")" >> "$GITHUB_OUTPUT"
          echo "frontend=$(join_tags "$base_fe" "$frontend_tags")" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai-collab-backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.backend }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ai-collab-frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.frontend }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Record source SHA and image digests
        run: |
          {
            echo "## Published images"
            echo "- source SHA: ${{ github.sha }}"
            echo '- backend: `${{ steps.tags.outputs.backend }}`'
            echo '- frontend: `${{ steps.tags.outputs.frontend }}`'
          } >> "$GITHUB_STEP_SUMMARY"
          short="${GITHUB_SHA::12}"
          docker buildx imagetools inspect "${{ steps.image-base.outputs.backend }}:sha-${short}" | grep -i 'Digest:' || true
          docker buildx imagetools inspect "${{ steps.image-base.outputs.frontend }}:sha-${short}" | grep -i 'Digest:' || true
