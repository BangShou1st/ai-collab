name: Install acceptance

# 一键安装工程的 Linux 真实引擎验收与回归：仅在干净的 ubuntu-latest Runner 上
# 手动触发（workflow_dispatch），执行 install.sh 全生命周期安装验收。
# 不挂到 push/PR：后端源码构建耗时较长，避免阻塞日常 CI；发布前与部署整改后手动执行。
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'GHCR 镜像标签（留空=验证源码构建回退路径；填 sha-xxxx 验证发布镜像拉取部署）'
        required: false
        default: ''
      backend_digest:
        description: '期望的后端镜像 digest（可选，用于发布一致性校验）'
        required: false
        default: ''
      frontend_digest:
        description: '期望的前端镜像 digest（可选）'
        required: false
        default: ''

permissions:
  contents: read
  packages: read

concurrency:
  group: install-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-install:
    name: Linux install lifecycle acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker availability
        run: |
          docker info
          docker compose version

      - name: Log in to GHCR
        if: ${{ inputs.image_tag != '' }}
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 管理员凭据只在脚本进程内存中流转，不进入任何日志或产物。
      - name: Run install acceptance
        env:
          INSTALL_ACCEPTANCE_TAG: ${{ inputs.image_tag }}
          INSTALL_ACCEPTANCE_EXPECT_BACKEND_DIGEST: ${{ inputs.backend_digest }}
          INSTALL_ACCEPTANCE_EXPECT_FRONTEND_DIGEST: ${{ inputs.frontend_digest }}
        run: bash ai-collab-deploy/scripts/install-acceptance.sh --port 18080

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-acceptance-evidence
          path: target/install-acceptance/
          retention-days: 14
          if-no-files-found: ignore
