# InstaBox Staging Nginx 配置：HTTP 终止在 80，外层由 InstaBox 边缘网关终止 HTTPS
map $http_x_forwarded_host $storage_forward_host_raw {
    default $http_x_forwarded_host;
    "" $http_host;
}

map $storage_forward_host_raw $storage_forward_host {
    ~^(?<h>.+):8443$ $h;
    default $storage_forward_host_raw;
}

server {
    listen 80;
    server_name _;
    # Compose 容器重建后地址可能变化；避免一直缓存启动时的旧地址
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 22m;
    root /usr/share/nginx/html;
    index index.html;

    # 操作端点仅能从容器内访问；不能回退到 SPA index.html
    location ^~ /actuator { return 404; }

    location /api/v1/ {
        set $app_upstream app-edge;
        proxy_pass http://$app_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # 丢弃客户端提供的转发链，只传本连接的实际来源
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # 外层 InstaBox 网关是 HTTPS，此处告知后端协议为 https
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OAuth 回调查询包含一次性授权码，不能写入代理日志。
    location = /api/v1/connector/oauth/callback {
        access_log off;
        error_log /dev/null crit;
        set $app_upstream app-edge;
        proxy_pass http://$app_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/api/v1/connector/events/[0-9A-Fa-f-]+$ {
        client_max_body_size 64k;
        access_log off;
        error_log /dev/null crit;
        set $app_upstream app-edge;
        proxy_pass http://$app_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /_storage_auth {
        internal;
        access_log off;
        error_log /dev/null crit;
        set $app_upstream app-edge;
        proxy_pass http://$app_upstream:8080/internal/storage-authorize?;
        proxy_method GET;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Storage-Path $storage_original_path;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Authorization "";
    }

    # 每次下载都检查当前知识可见状态，已签发 URL 在屏蔽后也不能继续发起下载。
    location /storage/ {
        if ($uri !~ ^/storage/[^/]+/.+) { return 404; }
        limit_except GET { deny all; }
        access_log off;
        error_log /dev/null crit;
        set $storage_original_path $uri;
        auth_request /_storage_auth;
        set $storage_upstream minio;
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://$storage_upstream:9000;
        proxy_set_header Host $storage_forward_host;
        proxy_set_header Authorization "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Proto "";
    }

    location / { try_files $uri $uri/ /index.html; }
}
