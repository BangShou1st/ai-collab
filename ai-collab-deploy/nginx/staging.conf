# InstaBox Staging Nginx 配置：HTTP 终止在 80，外层由 InstaBox 边缘网关终止 HTTPS
server {
    listen 80;
    server_name _;
    # Compose 容器重建后地址可能变化；避免一直缓存启动时的旧地址
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 22m;
    root /usr/share/nginx/html;
    index index.html;

    # 操作端点仅能从容器内访问；不能回退到 SPA index.html
    location ^~ /actuator { return 404; }

    location /api/v1/ {
        set $app_upstream app-edge;
        proxy_pass http://$app_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # 丢弃客户端提供的转发链，只传本连接的实际来源
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # 外层 InstaBox 网关是 HTTPS，此处告知后端协议为 https
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 仅转发预签名对象只读 GET/HEAD；去掉前缀由 MinIO 校验原始签名路径
    location /storage/ {
        if ($uri !~ ^/storage/[^/]+/.+) { return 404; }
        limit_except GET { deny all; }
        access_log off;
        error_log /dev/null crit;
        set $storage_upstream minio;
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://$storage_upstream:9000;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Proto "";
    }

    location / { try_files $uri $uri/ /index.html; }
}
