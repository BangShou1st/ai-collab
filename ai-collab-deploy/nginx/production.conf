# 此配置只适用于客户端直接连接本 Nginx 的拓扑，不信任上游代理/CDN。
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Compose 容器重建后地址可能变化；避免一直缓存启动时的旧地址。
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 22m;
    root /usr/share/nginx/html;
    index index.html;

    # 操作端点仅能从容器内访问；不能回退到 SPA index.html。
    location ^~ /actuator { return 404; }
    location /api/v1/ {
        set $app_upstream app-edge;
        proxy_pass http://$app_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # 丢弃客户端提供的转发链，只传本连接的实际来源。
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # OAuth 回调查询包含一次性授权码，不能写入代理日志。
    location = /api/v1/connector/oauth/callback {
        access_log off;
        error_log /dev/null crit;
        set $app_upstream app-edge;
        proxy_pass http://$app_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/api/v1/connector/events/[0-9A-Fa-f-]+$ {
        client_max_body_size 64k;
        access_log off;
        error_log /dev/null crit;
        set $app_upstream app-edge;
        proxy_pass http://$app_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /_storage_auth {
        internal;
        access_log off;
        error_log /dev/null crit;
        set $app_upstream app-edge;
        proxy_pass http://$app_upstream:8080/internal/storage-authorize?;
        proxy_method GET;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Storage-Path $storage_original_path;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Authorization "";
    }
    # 仅转发预签名对象的 GET/HEAD；去掉前缀后 MinIO 校验原始签名路径。
    # 禁止 access log：查询字符串包含短期签名。桶由应用专用账号的策略限制。
    location /storage/ {
        if ($uri !~ ^/storage/[^/]+/.+) { return 404; }
        limit_except GET { deny all; }
        access_log off;
        error_log /dev/null crit;
        set $storage_original_path $uri;
        auth_request /_storage_auth;
        set $storage_upstream minio;
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://$storage_upstream:9000;
        # SigV4 预签名按 MINIO_PUBLIC_ENDPOINT 的无端口 host 计算，$http_host 可能携带端口导致签名失配。
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Proto "";
    }
    location / { try_files $uri $uri/ /index.html; }
}
