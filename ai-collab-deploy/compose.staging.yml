# 独立 Staging 拓扑；持久化在 /data/ai-collab-staging/
x-app: &app
  image: ${APP_IMAGE:-ai-collab-backend:staging-39988959}
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    minio: {condition: service_healthy}
    db-init: {condition: service_completed_successfully}
    rocketmq-broker: {condition: service_healthy}
    rocketmq-topic-init: {condition: service_completed_successfully}
  healthcheck:
    # O1：健康探针走独立管理端口 8081（仅 compose 内网，不映射宿主机、不经 nginx）。
    test: ["CMD-SHELL", "wget -T 5 -qO- http://127.0.0.1:8081/actuator/health >/dev/null 2>&1 || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: production
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?required}
  # C0.1：应用只用非超级业务角色 ai_collab_app（db-init 创建并授予 public 所有权）；
  # 超级用户 POSTGRES_USER 只给 db-init 与备份。
  SPRING_DATASOURCE_USERNAME: ai_collab_app
  SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?required}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?required}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
  MINIO_BUCKET: ${MINIO_BUCKET:?required}
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?required}
  MINIO_REQUIRE_PUBLIC_ENDPOINT: "true"
  MINIO_MANAGE_BUCKET: "true"
  FEISHU_OAUTH_REDIRECT_URI: "${FEISHU_OAUTH_REDIRECT_URI:-}"
  CONNECTOR_CLEANUP_ENABLED: "${CONNECTOR_CLEANUP_ENABLED:-true}"
  JWT_SECRET: ${JWT_SECRET:?required}
  MODEL_CONFIG_MASTER_KEY: ${MODEL_CONFIG_MASTER_KEY:?required}
  AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?required}
  # 统一可信公开地址（P7.1）：邀请/密码重置/邮箱验证敏感链接的生成源。
  APP_PUBLIC_URL: "${APP_PUBLIC_URL:-}"
  # 邮件发送（P7.1）：未启用时降级为记录发送意图。
  MAIL_ENABLED: "${MAIL_ENABLED:-false}"
  MAIL_HOST: "${MAIL_HOST:-}"
  MAIL_PORT: "${MAIL_PORT:-587}"
  MAIL_USERNAME: "${MAIL_USERNAME:-}"
  MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
  MAIL_FROM: "${MAIL_FROM:-}"
  MAIL_STARTTLS: "${MAIL_STARTTLS:-true}"
  MAIL_SSL: "${MAIL_SSL:-false}"
  AUTH_PUBLIC_REGISTRATION_ENABLED: "true"
  REFRESH_COOKIE_SECURE: "true"
  REFRESH_COOKIE_ALLOW_INSECURE: "false"
  CHAT_ENABLED: "${CHAT_ENABLED:-false}"
  AGENT_ENABLED: "${AGENT_ENABLED:-false}"
  AGENT_MCP_ALLOWED_HOSTS: "${AGENT_MCP_ALLOWED_HOSTS:-}"
  MEMORY_JOB_ENABLED: "${MEMORY_JOB_ENABLED:-false}"
  MEMORY_JOB_RECOVERY_ENABLED: "${MEMORY_JOB_RECOVERY_ENABLED:-false}"
  # 内部 AI 令牌只有 Ed25519 一种：app 持私钥签发，ai-worker 只持公钥验签。
  INTERNAL_AI_ED25519_PRIVATE_KEY: "${INTERNAL_AI_ED25519_PRIVATE_KEY:?required}"
  INTERNAL_AI_ED25519_PUBLIC_KEYS: "${INTERNAL_AI_ED25519_PUBLIC_KEYS:-}"
  INTERNAL_AI_ED25519_KID: "${INTERNAL_AI_ED25519_KID:-k1}"
  MEMORY_JOB_WORKER_BASE_URL: "${MEMORY_JOB_WORKER_BASE_URL:-http://ai-worker:9100}"
  QUERY_PLAN_ENABLED: "${QUERY_PLAN_ENABLED:-false}"
  QUERY_PLAN_WORKER_BASE_URL: "${QUERY_PLAN_WORKER_BASE_URL:-http://ai-worker:9100}"
  PROMPT_REGISTRY_ENABLED: "${PROMPT_REGISTRY_ENABLED:-false}"
  PROMPT_REGISTRY_BASE_URL: "${PROMPT_REGISTRY_BASE_URL:-http://ai-worker:9100}"
  KNOWLEDGE_SEARCH_WORKER_BASE_URL: "${KNOWLEDGE_SEARCH_WORKER_BASE_URL:-http://ai-worker:9100}"
  AI_INDEX_WORKER_BASE_URL: "${AI_INDEX_WORKER_BASE_URL:-${KNOWLEDGE_SEARCH_WORKER_BASE_URL:-http://ai-worker:9100}}"
  RETRIEVAL_CONFIGURED_RERANK_ENABLED: "${RETRIEVAL_CONFIGURED_RERANK_ENABLED:-false}"
  RETRIEVAL_INLINE_RERANK_TOP8: "${RETRIEVAL_INLINE_RERANK_TOP8:-false}"
  RETRIEVAL_QA_MODE: "${RETRIEVAL_QA_MODE:-STRATEGY_AWARE}"
  RETRIEVAL_FORCE_LEGACY_DENSE: "${RETRIEVAL_FORCE_LEGACY_DENSE:-false}"
  RETRIEVAL_MULTI_QUERY_RERANK_PRIMARY_ONLY: "${RETRIEVAL_MULTI_QUERY_RERANK_PRIMARY_ONLY:-true}"
  # 可观测性 O1/O2：管理端口暴露白名单（8081 仅 compose 内网，不映射宿主机）；
  # OTLP gRPC 导出指向 compose 内 Tempo。
  MANAGEMENT_ENDPOINTS_EXPOSURE: "health,info,prometheus"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
  # 文档链路固定走 RocketMQ。false 仅用于运维紧急关闭：文档注册返回 503，不回落进程内执行。
  MQ_ENABLED: "${MQ_ENABLED:-true}"
  ROCKETMQ_NAMESRV_ADDR: "rocketmq-namesrv:9876"
  ROCKETMQ_DOCUMENT_TOPIC: "${ROCKETMQ_DOCUMENT_TOPIC:-document-processing}"
  ROCKETMQ_CONSUMER_GROUP: "${ROCKETMQ_CONSUMER_GROUP:-document-processing-consumer}"

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - /data/ai-collab-staging/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    logging: *logging

  db-init:
    # 一次性幂等任务：已有数据卷时 docker-entrypoint-initdb.d 不会重跑，
    # 因此每次 up 都执行 postgres/db-init.sql（扩展、ai_collab_app / ai_worker 角色、ai_index/ai_runtime schema 与隔离权限）。
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?required}
      PGUSER: ${POSTGRES_USER:?required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?required}
      AI_WORKER_DB_PASSWORD: ${AI_WORKER_DB_PASSWORD:?required}
    volumes:
      - ./postgres/db-init.sql:/db-init/db-init.sql:ro
    command:
      - sh
      - -c
      - exec psql -v ON_ERROR_STOP=1 -f /db-init/db-init.sql
    networks: [data]
    logging: *logging

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - /data/ai-collab-staging/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    logging: *logging

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - /data/ai-collab-staging/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [data]
    logging: *logging

  rocketmq-volume-init:
    # 一次性修正卷属主：镜像内不存在 store/logs 目录，命名卷首次创建时归 root，
    # 而 broker/namesrv 以 uid 3000 运行，不修正会写入失败并反复重启（冒烟实测）。
    # 每次 up 幂等执行；无网络、仅 chown，完成后退出。
    image: apache/rocketmq:5.3.3@sha256:455287638deddbbcd6cf48cdf988ed4d05bbac7265acc0c399d9d8228862a7d7
    user: "0:0"
    restart: "no"
    network_mode: none
    logging: *logging
    command: ["chown", "-R", "3000:3000", "/v/store", "/v/broker-logs", "/v/namesrv-logs"]
    volumes:
      - rocketmq_store:/v/store
      - rocketmq_broker_logs:/v/broker-logs
      - rocketmq_namesrv_logs:/v/namesrv-logs

  rocketmq-namesrv:
    # 文档处理链路 RocketMQ NameServer（常驻）。数据面仅 internal 网络，不映射宿主机管理端口。
    image: apache/rocketmq:5.3.3@sha256:455287638deddbbcd6cf48cdf988ed4d05bbac7265acc0c399d9d8228862a7d7
    restart: unless-stopped
    depends_on:
      rocketmq-volume-init: {condition: service_completed_successfully}
    command: ["sh", "mqnamesrv"]
    environment:
      # mqnamesrv/mqbroker 脚本读取 JAVA_OPT_EXT 追加 JVM 参数；按容器资源收敛堆大小
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    volumes:
      - rocketmq_namesrv_logs:/home/rocketmq/logs
    healthcheck:
      # mqadmin 失败路径也返回退出码 0（已实测），必须 grep 匹配输出做存活判定
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 | grep -q 'Cluster Name'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [data]
    logging: *logging

  rocketmq-broker:
    # 文档处理链路 Broker（常驻）。broker.conf 挂载自版本库（brokerIP1=服务名、
    # 关闭自动建 topic）；store 目录持久化到独立卷。
    image: apache/rocketmq:5.3.3@sha256:455287638deddbbcd6cf48cdf988ed4d05bbac7265acc0c399d9d8228862a7d7
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv: {condition: service_healthy}
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/conf/broker.conf"]
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq_store:/home/rocketmq/store
      - rocketmq_broker_logs:/home/rocketmq/logs
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
    healthcheck:
      # broker 存活判定 = 已在 NameServer 注册且可见（同集群名单内）
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 | grep -q broker-a"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [data]
    logging: *logging

  rocketmq-topic-init:
    # autoCreateTopicEnable=false（topic 显式声明契约）：一次性任务预建文档注册 topic、
    # 其消费组与死信 topic（死信同样必须预建，否则重试耗尽的消息会因无路由丢失）。
    image: apache/rocketmq:5.3.3@sha256:455287638deddbbcd6cf48cdf988ed4d05bbac7265acc0c399d9d8228862a7d7
    restart: "on-failure:10"
    depends_on:
      rocketmq-broker: {condition: service_healthy}
    environment:
      ROCKETMQ_DOCUMENT_TOPIC: "${ROCKETMQ_DOCUMENT_TOPIC:-document-processing}"
      ROCKETMQ_CONSUMER_GROUP: "${ROCKETMQ_CONSUMER_GROUP:-document-processing-consumer}"
    command:
      - sh
      - -c
      - |
        set -e
        sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t "$$ROCKETMQ_DOCUMENT_TOPIC"
        sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t "%DLQ%$$ROCKETMQ_CONSUMER_GROUP"
        sh mqadmin updateSubGroup -n rocketmq-namesrv:9876 -c DefaultCluster -g "$$ROCKETMQ_CONSUMER_GROUP"
    networks: [data]
    logging: *logging

  # 双实例：同一镜像、同一 env；APP_INSTANCE_ID 区分 RocketMQ 客户端 instanceName。
  # 两实例共享 data 网络别名 app-internal，供 ai-worker 回调内部网关。
  app-1:
    <<: *app
    environment:
      <<: *app-env
      APP_INSTANCE_ID: app-1
    networks:
      # nginx 经 edge 网络访问实例，后端看到的来源固定是受信代理 172.30.173.2。
      edge:
        aliases: [app-1-edge]
      data:
        aliases: [app-internal]

  app-2:
    <<: *app
    environment:
      <<: *app-env
      APP_INSTANCE_ID: app-2
    networks:
      edge:
        aliases: [app-2-edge]
      data:
        aliases: [app-internal]

  prometheus:
    # O1 指标抓取：抓 app-1/app-2:8081/actuator/prometheus，仅 data 内网。
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.staging.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -T 5 -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [data]
    logging: *logging

  tempo:
    # O2 trace 后端：接收 app 的 OTLP gRPC 导出，供 Grafana 查询。
    image: grafana/tempo:2.7.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    user: root
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -T 5 -q --spider http://127.0.0.1:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [data]
    logging: *logging

  grafana:
    # O1/O2 面板（仅 local/staging，设计 §5）：staging 不发布宿主机端口，
    # 面板经 SSH 隧道或运维通道访问；数据源与最小面板经 provisioning 自动装载。
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    depends_on:
      prometheus: {condition: service_started}
      tempo: {condition: service_started}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -T 5 -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [data]
    logging: *logging

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app-1: {condition: service_started}
      app-2: {condition: service_started}
    ports:
      - "${STAGING_PORT:-8443}:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ../ai-collab-frontend/dist:/usr/share/nginx/html:ro
    networks:
      edge:
        ipv4_address: 172.30.173.2
      data: {}
    logging: *logging

  ai-worker:
    # AI 能力面（query-plan / prompt registry / memory job / ai-index & knowledge search）。
    # 只在 data 内网可达，不映射宿主机端口；模型调用凭据经 Java 内部网关按次租借。
    image: ${AI_WORKER_IMAGE:-ai-collab-ai-worker:dev}
    restart: unless-stopped
    command: ["uvicorn", "ai_collab_worker.main:app", "--host", "0.0.0.0", "--port", "9100"]
    environment:
      AI_WORKER_HOST: "0.0.0.0"
      AI_WORKER_PORT: "9100"
      AI_WORKER_PROMPTS_DIR: "/app/prompts"
      # Java 内部接口（凭据租借 / 用量回报 / 任务回调）；data 别名 app-internal 同时指向 app-1/app-2。
      JAVA_INTERNAL_BASE_URL: "http://app-internal:8080"
      # Stream 消费（契约 §8）；主机与端口与 app 段的 Redis 一致，密码只经 env 引用。
      REDIS_URL: "redis://:${REDIS_PASSWORD:?required}@redis:6379"
      # P2 ai_index 数据库连接（契约 §5.2）；只允许非超级角色 ai_worker，禁止超级用户或业务角色凭据。
      AI_INDEX_DATABASE_URL: "postgresql://ai_worker:${AI_WORKER_DB_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}"
      # 只持公钥验签（kid=SPKI-DER-base64 列表）；不持私钥。
      AI_WORKER_ED25519_PUBLIC_KEYS: "${AI_WORKER_ED25519_PUBLIC_KEYS:?required}"
      # 公网出口只有 egress-proxy（白名单 + CONNECT 443）；内部主机一律直连、不走代理。
      HTTPS_PROXY: "http://egress-proxy:8888"
      HTTP_PROXY: "http://egress-proxy:8888"
      NO_PROXY: "localhost,127.0.0.1,app-internal,app-1,app-2,ai-worker,ai-worker-api,egress-proxy,postgres,redis,minio,reranker,rocketmq-namesrv,rocketmq-broker,rocketmq-topic-init,db-init,prometheus,tempo,grafana,proxy"
    depends_on:
      postgres: {condition: service_healthy}
      db-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      egress-proxy: {condition: service_healthy}
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      data:
        aliases:
          - ai-worker
          - ai-worker-api
    logging: *logging

  egress-proxy:
    # ai-worker 唯一的公网出口（2026-11-27 决策：白名单出网代理）。tinyproxy 只在 data 侧地址监听、
    # 只接受 data 子网来源、FilterDefaultDeny + 域名白名单、只放行 CONNECT 443；edge 只用于出网。
    # 白名单见 egress/allowlist，新增模型厂商时必须同步。
    image: ${EGRESS_PROXY_IMAGE:-ai-collab-egress-proxy:tinyproxy-1.11.2-alpine3.21}
    build: ./egress
    restart: unless-stopped
    volumes:
      - ./egress/allowlist:/etc/egress/allowlist:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/egress/listen && pidof tinyproxy >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      data: {}
      edge: {}
    logging: *logging

  reranker:
    # Qwen3-Reranker-0.6B CPU 推理（llama.cpp server）。模型文件外置在宿主机，
    # 只读挂载；网络别名 reranker 供能力 provider 的 baseUrl 使用。
    image: ${RERANKER_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    command: ["-m", "${RERANKER_MODEL_PATH:-/models/qwen3-reranker-0.6b-q8_0.gguf}",
              "--host", "0.0.0.0", "--port", "${RERANKER_PORT:-18081}", "--rerank",
              # 4 vCPU staging 主机：2k 上下文 + 4 线程 + 6 slot + flash-attn，
              # 6 候选实测 1.8s、两路并发 3.8s；inline 预算已放宽到 5s。
              "-c", "${RERANKER_CONTEXT:-2048}", "-b", "512", "-ub", "512",
              "-t", "${RERANKER_THREADS:-4}", "-np", "${RERANKER_PARALLEL:-6}",
              "-fa", "${RERANKER_FLASH_ATTN:-on}", "--no-webui"]
    volumes:
      - /data/ai-collab-staging/models:/models:ro
    mem_limit: 2g
    cpus: 4.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [data]
    logging: *logging

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.173.0/24
          ip_range: 172.30.173.128/25
          gateway: 172.30.173.1
