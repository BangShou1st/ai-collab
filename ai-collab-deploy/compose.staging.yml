# 独立 Staging 拓扑；持久化在 /data/ai-collab-staging/
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - /data/ai-collab-staging/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - /data/ai-collab-staging/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    logging: *logging

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - /data/ai-collab-staging/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [data]
    logging: *logging

  rocketmq-namesrv:
    # M1 MQ 迁移：文档处理链路 RocketMQ NameServer（路由注册中心）。
    # 数据面仅 internal 网络，不映射宿主机管理端口（契约脚本断言）。
    image: apache/rocketmq:5.3.3@sha256:455287638deddbbcd6cf48cdf988ed4d05bbac7265acc0c399d9d8228862a7d7
    restart: unless-stopped
    command: ["sh", "mqnamesrv"]
    environment:
      # mqnamesrv/mqbroker 脚本读取 JAVA_OPT_EXT 追加 JVM 参数；按容器资源收敛堆大小
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    volumes:
      - rocketmq_namesrv_logs:/home/rocketmq/logs
    healthcheck:
      # mqadmin 失败路径也返回退出码 0（已实测），必须 grep 匹配输出做存活判定
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 | grep -q 'Cluster Name'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [data]
    logging: *logging

  rocketmq-broker:
    # M1 MQ 迁移：文档处理链路 Broker。broker.conf 挂载自版本库（brokerIP1=服务名、
    # 关闭自动建 topic）；store 目录持久化到独立卷。
    image: apache/rocketmq:5.3.3@sha256:455287638deddbbcd6cf48cdf988ed4d05bbac7265acc0c399d9d8228862a7d7
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv: {condition: service_healthy}
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/conf/broker.conf"]
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq_store:/home/rocketmq/store
      - rocketmq_broker_logs:/home/rocketmq/logs
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    healthcheck:
      # broker 存活判定 = 已在 NameServer 注册且可见（同集群名单内）
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 | grep -q broker-a"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [data]
    logging: *logging

  rocketmq-topic-init:
    # M1 MQ 迁移：autoCreateTopicEnable=false（topic 显式声明契约），由一次性任务按
    # 环境变量声明业务 topic、死信 topic（autoCreateTopicEnable=false 下死信同样必须
    # 预建，否则重试耗尽的消息会因无路由丢失）与消费组。
    image: apache/rocketmq:5.3.3@sha256:455287638deddbbcd6cf48cdf988ed4d05bbac7265acc0c399d9d8228862a7d7
    restart: "on-failure:10"
    depends_on:
      rocketmq-broker: {condition: service_healthy}
    environment:
      ROCKETMQ_DOCUMENT_TOPIC: "${ROCKETMQ_DOCUMENT_TOPIC:-document-processing}"
      ROCKETMQ_CONSUMER_GROUP: "${ROCKETMQ_CONSUMER_GROUP:-document-processing-consumer}"
    command:
      - sh
      - -c
      - |
        set -e
        sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t "$$ROCKETMQ_DOCUMENT_TOPIC"
        sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t "%DLQ%$$ROCKETMQ_CONSUMER_GROUP"
        sh mqadmin updateSubGroup -n rocketmq-namesrv:9876 -c DefaultCluster -g "$$ROCKETMQ_CONSUMER_GROUP"
    networks: [data]
    logging: *logging

  app:
    image: ${APP_IMAGE:-ai-collab-backend:staging-39988959}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
      MINIO_BUCKET: ${MINIO_BUCKET:?required}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?required}
      MINIO_REQUIRE_PUBLIC_ENDPOINT: "true"
      MINIO_MANAGE_BUCKET: "true"
      FEISHU_OAUTH_REDIRECT_URI: "${FEISHU_OAUTH_REDIRECT_URI:-}"
      CONNECTOR_CLEANUP_ENABLED: "${CONNECTOR_CLEANUP_ENABLED:-true}"
      OPENCODE_ZEN_RELAY_URL: "${OPENCODE_ZEN_RELAY_URL:-}"
      JWT_SECRET: ${JWT_SECRET:?required}
      MODEL_CONFIG_MASTER_KEY: ${MODEL_CONFIG_MASTER_KEY:?required}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?required}
      # 统一可信公开地址（P7.1）：邀请/密码重置/邮箱验证敏感链接的生成源。
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-}"
      # 邮件发送（P7.1）：未启用时降级为记录发送意图。
      MAIL_ENABLED: "${MAIL_ENABLED:-false}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_STARTTLS: "${MAIL_STARTTLS:-true}"
      MAIL_SSL: "${MAIL_SSL:-false}"
      AUTH_PUBLIC_REGISTRATION_ENABLED: "true"
      REFRESH_COOKIE_SECURE: "true"
      REFRESH_COOKIE_ALLOW_INSECURE: "false"
      CHAT_ENABLED: "${CHAT_ENABLED:-false}"
      AGENT_ENABLED: "${AGENT_ENABLED:-false}"
      AGENT_MCP_ALLOWED_HOSTS: "${AGENT_MCP_ALLOWED_HOSTS:-}"
      # 可观测性 O1/O2：管理端口暴露白名单（8081 仅 compose 内网，不映射宿主机）；
      # OTLP gRPC 导出指向 compose 内 Tempo。
      MANAGEMENT_ENDPOINTS_EXPOSURE: "health,info,prometheus"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      # M1 MQ 迁移：文档链路消息总闸。staging 默认开启以演练 MQ 路径；设为 false 可
      # 完全回落进程内路径（回落模式仅限单实例部署，去重集合已删除）。
      MQ_ENABLED: "${MQ_ENABLED:-true}"
      ROCKETMQ_NAMESRV_ADDR: "rocketmq-namesrv:9876"
      ROCKETMQ_DOCUMENT_TOPIC: "${ROCKETMQ_DOCUMENT_TOPIC:-document-processing}"
      ROCKETMQ_CONSUMER_GROUP: "${ROCKETMQ_CONSUMER_GROUP:-document-processing-consumer}"
    healthcheck:
      # O1：健康探针走独立管理端口 8081（仅 compose 内网，不映射宿主机、不经 nginx）。
      test: ["CMD-SHELL", "wget -T 5 -qO- http://127.0.0.1:8081/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      edge:
        aliases: [app-edge]
      data: {}
    logging: *logging

  prometheus:
    # O1 指标抓取：抓 app:8081/actuator/prometheus，仅 data 内网。
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -T 5 -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [data]
    logging: *logging

  tempo:
    # O2 trace 后端：接收 app 的 OTLP gRPC 导出，供 Grafana 查询。
    image: grafana/tempo:2.7.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    user: root
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -T 5 -q --spider http://127.0.0.1:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [data]
    logging: *logging

  grafana:
    # O1/O2 面板（仅 local/staging，设计 §5）：staging 不发布宿主机端口，
    # 面板经 SSH 隧道或运维通道访问；数据源与最小面板经 provisioning 自动装载。
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    depends_on:
      prometheus: {condition: service_started}
      tempo: {condition: service_started}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -T 5 -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [data]
    logging: *logging

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app: {condition: service_started}
    ports:
      - "${STAGING_PORT:-8443}:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ../ai-collab-frontend/dist:/usr/share/nginx/html:ro
    networks:
      edge:
        ipv4_address: 172.30.173.2
      data: {}
    logging: *logging

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.173.0/24
          ip_range: 172.30.173.128/25
          gateway: 172.30.173.1
  data:
    internal: true

volumes:
  prometheus_data:
  tempo_data:
  grafana_data:
  rocketmq_namesrv_logs:
  rocketmq_broker_logs:
  rocketmq_store:
