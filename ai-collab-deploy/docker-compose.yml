services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-collab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${AI_COLLAB_PG_HOST_PORT:-5432}:5432"
    volumes:
      - ai_collab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ai-collab-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    ports:
      - "${AI_COLLAB_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ai_collab_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD}
        - ping
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # MinIO 官方已撤下可匿名拉取的服务端镜像：Docker Hub 的 minio/minio 仓库不存在，
    # quay.io/minio/minio 对匿名请求返回 401（仓库策略，非网络故障）。官方 release
    # 说明改为"自行 clone 源码构建"。这里改用 Chainguard 构建的同一服务端，跟踪
    # minio/minio 上游 master（当前 digest 对应 RELEASE.2026-09-22T19-25-18Z），
    # 按 digest 固定以保证可复现；digest 更新方式见 docs/deployment-recovery.md。
    image: cgr.dev/chainguard/minio:latest@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18
    container_name: ai-collab-minio
    restart: unless-stopped
    # Chainguard 镜像的 ENTRYPOINT 是 /usr/bin/minio，所以此处只给子命令参数。
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${AI_COLLAB_MINIO_HOST_PORT:-9000}:9000"
      - "${AI_COLLAB_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - ai_collab_minio_data:/data
    healthcheck:
      # 服务端以非 root（uid/gid 65532）运行，镜像内无 curl；/minio/health/ready 无需凭据。
      test:
        - CMD-SHELL
        - 'mc ready local >/dev/null 2>&1 || exit 1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mailpit:
    # 本地/演练专用 SMTP 假服务器（可选）：`docker compose --profile maildev up -d mailpit`
    # 后配合 .env 的 MAIL_ENABLED=true / MAIL_HOST=localhost / MAIL_PORT=1025 使用，
    # 即可在本地完整收发验证邮件与密码重置邮件，无需外部 SMTP 凭据。
    # 收件箱 UI: http://localhost:8025 。生产严禁启用该 profile 或把 MAIL_HOST 指向它。
    profiles: ["maildev"]
    image: axllent/mailpit:latest
    container_name: ai-collab-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build:
      context: ..
      dockerfile: ai-collab-backend/Dockerfile
    image: ai-collab-backend:local
    container_name: ai-collab-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      EMBEDDING_LOCAL_ALLOWED_TARGETS: ${EMBEDDING_LOCAL_ALLOWED_TARGETS:-host.docker.internal:11434}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_PUBLIC_REGISTRATION_ENABLED: ${AUTH_PUBLIC_REGISTRATION_ENABLED}
      MODEL_CONFIG_MASTER_KEY: ${MODEL_CONFIG_MASTER_KEY}
      AGENT_RUNTIME_ALLOWED: ${AGENT_RUNTIME_ALLOWED:-true}
      CHAT_ENABLED: ${CHAT_ENABLED}
      CHAT_PROVIDER: ${CHAT_PROVIDER}
      CHAT_BASE_URL: ${CHAT_BASE_URL}
      CHAT_API_KEY: ${CHAT_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL}
      AGENT_ENABLED: ${AGENT_ENABLED}
      AGENT_MCP_ALLOWED_HOSTS: ${AGENT_MCP_ALLOWED_HOSTS}
      KNOWLEDGE_RATE_LIMIT_PER_USER_HOUR: ${KNOWLEDGE_RATE_LIMIT_PER_USER_HOUR}
      # J2 PromptPack：Prompt 资产来源。默认 false = 读镜像内置只读 fallback 包
      # （classpath:promptpack/，零外呼，正文与迁移前逐字节一致）；设为 true 才访问
      # ai-worker 的 /v1/prompts/*（仅内部网，容器服务名见部署拓扑）。
      # ai-worker 容器本身在后续波次加入编排，此处先透传开关以便按环境启用/回退。
      PROMPT_REGISTRY_ENABLED: ${PROMPT_REGISTRY_ENABLED:-false}
      PROMPT_REGISTRY_BASE_URL: ${PROMPT_REGISTRY_BASE_URL:-http://ai-worker-api:9100}
      PROMPT_REGISTRY_REFRESH_INTERVAL: ${PROMPT_REGISTRY_REFRESH_INTERVAL:-PT5M}
      # W3 rerank：模式默认 java（行为与迁移前完全一致、零外呼）；worker 地址与令牌
      # 只在切换到 shadow/python 后生效。RERANK_SERVICE_TOKEN 同时下发 worker
      # （AI_WORKER_SERVICE_TOKEN）用于 /internal/ai/** 双向鉴权，未配置则 fail closed。
      RERANK_MODE: ${RERANK_MODE:-java}
      RERANK_WORKER_BASE_URL: ${RERANK_WORKER_BASE_URL:-http://ai-worker-api:9100}
      RERANK_SERVICE_TOKEN: ${RERANK_SERVICE_TOKEN:-}
      RERANK_MODEL_USER_ID: ${RERANK_MODEL_USER_ID:-}
      PLANNING_GENERATION_LIMIT_PER_USER_HOUR: ${PLANNING_GENERATION_LIMIT_PER_USER_HOUR}
      # Planning 真实生效的调优参数（源码消费点：TaskPlanModelClient /
      # PlanningModelConfigurationStore / TaskPlanContextAssembler /
      # PlanningAsyncConfiguration）。注意：规划模型本体不走 PLANNING_PROVIDER /
      # PLANNING_MODEL 等变量（历史遗留，已无运行时消费点），而是按用户级
      # AI Provider 分配（个人设置 -> AI 设置）解析，此处无需也不应透传。
      PLANNING_MAX_OUTPUT_TOKENS: "${PLANNING_MAX_OUTPUT_TOKENS:-6000}"
      PLANNING_MAX_SOURCES: "${PLANNING_MAX_SOURCES:-12}"
      PLANNING_SOURCE_CODEPOINT_BUDGET: "${PLANNING_SOURCE_CODEPOINT_BUDGET:-16000}"
      PLANNING_RETRIEVAL_THRESHOLD: "${PLANNING_RETRIEVAL_THRESHOLD:-0.55}"
      PLANNING_EXECUTOR_CORE_SIZE: "${PLANNING_EXECUTOR_CORE_SIZE:-2}"
      PLANNING_EXECUTOR_MAX_SIZE: "${PLANNING_EXECUTOR_MAX_SIZE:-4}"
      PLANNING_EXECUTOR_QUEUE_CAPACITY: "${PLANNING_EXECUTOR_QUEUE_CAPACITY:-20}"
      # Embedding 说明：生产运行的向量模型配置不来自 EMBEDDING_* 环境变量
      # （除下方 LOCAL_ALLOWED_TARGETS 外均为历史遗留，无运行时消费点），
      # 而是由系统管理员在「AI Infrastructure」界面配置并加密入库
      # （system_embedding_config，密钥经 MODEL_CONFIG_MASTER_KEY 加密）。
      # EMBEDDING_LOCAL_ALLOWED_TARGETS 是 Ollama 本地 endpoint 白名单，真实生效：
      # app 容器访问宿主机 Ollama 用 host.docker.internal，不是 127.0.0.1
      # （容器内 127.0.0.1 指容器自身）；使用 Compose 网络内服务名或外部
      # Embedding Endpoint 时改为对应 host:port。
      # 生产基线：Refresh Cookie 默认 Secure（需 HTTPS / TLS 终止代理）。
      # 仅在明确搭建纯 HTTP 演练环境时才允许同时设置 REFRESH_COOKIE_SECURE=false
      # 与 REFRESH_COOKIE_ALLOW_INSECURE=true，否则应用启动即失败（绑定校验）。
      REFRESH_COOKIE_SECURE: "${REFRESH_COOKIE_SECURE:-true}"
      REFRESH_COOKIE_ALLOW_INSECURE: "${REFRESH_COOKIE_ALLOW_INSECURE:-false}"
      # 认证端点 CORS 白名单：生产必须显式设置为前端站点 Origin（逗号分隔），不能用默认值上生产。
      AUTH_ALLOWED_ORIGINS: "${AUTH_ALLOWED_ORIGINS:-http://localhost:5173}"
      # 统一可信公开地址：邀请/密码重置/邮箱验证等敏感链接的生成源（只允许 origin）。
      # 本地单机演练可留空（前端回退当前页面 Origin）；服务器部署必须配置为正式前端地址。
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-}"
      # 邮件发送（密码重置/邮箱验证）。false 时仅记录发送意图，不投递，不影响本地演练。
      MAIL_ENABLED: "${MAIL_ENABLED:-false}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_STARTTLS: "${MAIL_STARTTLS:-true}"
      MAIL_SSL: "${MAIL_SSL:-false}"
    ports:
      - "8080:8080"
    networks:
      - default
      - ai

  # W3 AI 能力面（Python worker），默认不随 `up -d` 启动：
  #   docker compose --profile ai-worker up -d ai-worker-api
  # 安全边界：只在 `ai`（internal: true）网络可达，不映射宿主端口；read_only + tmpfs /tmp；
  # 丢弃全部 capabilities 并禁止提权。worker 无 DB/Redis/MinIO 凭据与网络，
  # 模型调用一律回 Java 的 /internal/ai/v1/model-calls（见 ai-collab-backend）。
  ai-worker-api:
    image: ${AI_WORKER_IMAGE:-ai-collab-ai-worker:dev}
    container_name: ai-collab-ai-worker-api
    restart: unless-stopped
    profiles: ["ai-worker"]
    networks:
      - ai
    environment:
      AI_WORKER_ROLE: api
      # 与 app 的 RERANK_SERVICE_TOKEN 同源；未配置时 worker 与 Java 端点都会 fail closed。
      AI_WORKER_SERVICE_TOKEN: ${RERANK_SERVICE_TOKEN:-}
      # worker -> Java 内部模型网关（仅 ai 网络内可解析 app:8080）。
      AI_WORKER_JAVA_GATEWAY_URL: http://app:8080
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

networks:
  # 现有业务网络（postgres/redis/minio/app 默认加入）。
  default:
  # AI 内部网络：Docker 层面禁止访问宿主/外网；只有 app 与 ai-worker-api 加入。
  ai:
    internal: true

volumes:
  # postgres 数据卷名可经 .env 的 AI_COLLAB_PG_DATA_VOLUME 覆盖,
  # 用于延续历史数据卷(如 p2-business-e2e 验收数据集)。
  ai_collab_postgres_data:
    name: ${AI_COLLAB_PG_DATA_VOLUME:-ai_collab_postgres_data}
  ai_collab_redis_data:
  ai_collab_minio_data:
