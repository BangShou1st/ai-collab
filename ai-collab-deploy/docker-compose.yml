services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-collab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${AI_COLLAB_PG_HOST_PORT:-5432}:5432"
    volumes:
      - ai_collab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default
      - ai

  db-init:
    # 一次性幂等任务（dev.ps1 start/start-dual 在 postgres 健康后执行）：以超级用户 POSTGRES_USER
    # 运行 postgres/db-init.sql，预装扩展、创建 ai_collab_app / ai_worker 并收紧 schema 边界。
    image: pgvector/pgvector:pg17
    container_name: ai-collab-db-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      AI_WORKER_DB_PASSWORD: ${AI_WORKER_DB_PASSWORD:-}
    volumes:
      - ./postgres/db-init.sql:/db-init/db-init.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/db-init/db-init.sql"]
    networks:
      - default
      - ai

  redis:
    image: redis:7-alpine
    container_name: ai-collab-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    ports:
      - "${AI_COLLAB_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ai_collab_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD}
        - ping
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default
      - ai

  minio:
    # MinIO 官方已撤下可匿名拉取的服务端镜像：Docker Hub 的 minio/minio 仓库不存在，
    # quay.io/minio/minio 对匿名请求返回 401（仓库策略，非网络故障）。官方 release
    # 说明改为"自行 clone 源码构建"。这里改用 Chainguard 构建的同一服务端，跟踪
    # minio/minio 上游 master（当前 digest 对应 RELEASE.2026-09-22T19-25-18Z），
    # 按 digest 固定以保证可复现；digest 更新方式见 docs/deployment-recovery.md。
    image: cgr.dev/chainguard/minio:latest@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18
    container_name: ai-collab-minio
    restart: unless-stopped
    # Chainguard 镜像的 ENTRYPOINT 是 /usr/bin/minio，所以此处只给子命令参数。
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${AI_COLLAB_MINIO_HOST_PORT:-9000}:9000"
      - "${AI_COLLAB_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - ai_collab_minio_data:/data
    healthcheck:
      # 服务端以非 root（uid/gid 65532）运行，镜像内无 curl；/minio/health/ready 无需凭据。
      test:
        - CMD-SHELL
        - 'mc ready local >/dev/null 2>&1 || exit 1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mailpit:
    # 本地/演练专用 SMTP 假服务器（可选）：`docker compose --profile maildev up -d mailpit`
    # 后配合 .env 的 MAIL_ENABLED=true / MAIL_HOST=localhost / MAIL_PORT=1025 使用，
    # 即可在本地完整收发验证邮件与密码重置邮件，无需外部 SMTP 凭据。
    # 收件箱 UI: http://localhost:8025 。生产严禁启用该 profile 或把 MAIL_HOST 指向它。
    profiles: ["maildev"]
    image: axllent/mailpit:latest
    container_name: ai-collab-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build:
      context: ..
      dockerfile: ai-collab-backend/Dockerfile
    image: ai-collab-backend:local
    container_name: ai-collab-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      rocketmq-topic-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      # C0.1：应用只用非超级业务角色 ai_collab_app（由 db-init 创建）。
      SPRING_DATASOURCE_USERNAME: ai_collab_app
      EMBEDDING_LOCAL_ALLOWED_TARGETS: ${EMBEDDING_LOCAL_ALLOWED_TARGETS:-host.docker.internal:11434}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_PUBLIC_REGISTRATION_ENABLED: ${AUTH_PUBLIC_REGISTRATION_ENABLED}
      MODEL_CONFIG_MASTER_KEY: ${MODEL_CONFIG_MASTER_KEY}
      AGENT_RUNTIME_ALLOWED: ${AGENT_RUNTIME_ALLOWED:-true}
      CHAT_ENABLED: ${CHAT_ENABLED}
      CHAT_PROVIDER: ${CHAT_PROVIDER}
      CHAT_BASE_URL: ${CHAT_BASE_URL}
      CHAT_API_KEY: ${CHAT_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL}
      AGENT_ENABLED: ${AGENT_ENABLED}
      AGENT_MCP_ALLOWED_HOSTS: ${AGENT_MCP_ALLOWED_HOSTS}
      KNOWLEDGE_RATE_LIMIT_PER_USER_HOUR: ${KNOWLEDGE_RATE_LIMIT_PER_USER_HOUR}
      # J2 PromptPack：Prompt 资产来源。默认 false = 读镜像内置只读 fallback 包
      # （classpath:promptpack/，零外呼，正文与迁移前逐字节一致）；设为 true 才访问
      # ai-worker 的 /v1/prompts/*（仅内部网，容器服务名见部署拓扑）。
      # ai-worker 容器本身在后续波次加入编排，此处先透传开关以便按环境启用/回退。
      PROMPT_REGISTRY_ENABLED: ${PROMPT_REGISTRY_ENABLED:-false}
      PROMPT_REGISTRY_BASE_URL: ${PROMPT_REGISTRY_BASE_URL:-http://ai-worker:9100}
      PROMPT_REGISTRY_REFRESH_INTERVAL: ${PROMPT_REGISTRY_REFRESH_INTERVAL:-PT5M}
      KNOWLEDGE_SEARCH_WORKER_BASE_URL: ${KNOWLEDGE_SEARCH_WORKER_BASE_URL:-http://ai-worker:9100}
      KNOWLEDGE_INDEX_JOBS_ENABLED: "true"
      AI_INDEX_WORKER_BASE_URL: ${AI_INDEX_WORKER_BASE_URL:-${KNOWLEDGE_SEARCH_WORKER_BASE_URL:-http://ai-worker:9100}}
      # 内部 AI 令牌只有 Ed25519 一种：app 持私钥签发，ai-worker 只持公钥验签。
      # 开发 compose 不做 :? 强校验（否则仅起基础设施时也会渲染失败）；缺失时 app 启动即失败。
      INTERNAL_AI_ED25519_PRIVATE_KEY: ${INTERNAL_AI_ED25519_PRIVATE_KEY:-}
      INTERNAL_AI_ED25519_PUBLIC_KEYS: ${INTERNAL_AI_ED25519_PUBLIC_KEYS:-}
      INTERNAL_AI_ED25519_KID: ${INTERNAL_AI_ED25519_KID:-k1}
      # 文档链路固定走 RocketMQ；false 仅用于运维紧急关闭（文档注册返回 503）。
      MQ_ENABLED: ${MQ_ENABLED:-true}
      ROCKETMQ_NAMESRV_ADDR: rocketmq-namesrv:9876
      ROCKETMQ_DOCUMENT_TOPIC: ${ROCKETMQ_DOCUMENT_TOPIC:-document-processing}
      ROCKETMQ_CONSUMER_GROUP: ${ROCKETMQ_CONSUMER_GROUP:-document-processing-consumer}
      PLANNING_GENERATION_LIMIT_PER_USER_HOUR: ${PLANNING_GENERATION_LIMIT_PER_USER_HOUR}
      # Planning 真实生效的调优参数（源码消费点：TaskPlanModelClient /
      # PlanningModelConfigurationStore / TaskPlanContextAssembler /
      # PlanningAsyncConfiguration）。注意：规划模型本体不走 PLANNING_PROVIDER /
      # PLANNING_MODEL 等变量（历史遗留，已无运行时消费点），而是按用户级
      # AI Provider 分配（个人设置 -> AI 设置）解析，此处无需也不应透传。
      PLANNING_MAX_OUTPUT_TOKENS: "${PLANNING_MAX_OUTPUT_TOKENS:-6000}"
      PLANNING_MAX_SOURCES: "${PLANNING_MAX_SOURCES:-12}"
      PLANNING_SOURCE_CODEPOINT_BUDGET: "${PLANNING_SOURCE_CODEPOINT_BUDGET:-16000}"
      PLANNING_RETRIEVAL_THRESHOLD: "${PLANNING_RETRIEVAL_THRESHOLD:-0.55}"
      PLANNING_EXECUTOR_CORE_SIZE: "${PLANNING_EXECUTOR_CORE_SIZE:-2}"
      PLANNING_EXECUTOR_MAX_SIZE: "${PLANNING_EXECUTOR_MAX_SIZE:-4}"
      PLANNING_EXECUTOR_QUEUE_CAPACITY: "${PLANNING_EXECUTOR_QUEUE_CAPACITY:-20}"
      # Embedding 说明：生产运行的向量模型配置不来自 EMBEDDING_* 环境变量
      # （除下方 LOCAL_ALLOWED_TARGETS 外均为历史遗留，无运行时消费点），
      # 而是由系统管理员在「AI Infrastructure」界面配置并加密入库
      # （system_embedding_config，密钥经 MODEL_CONFIG_MASTER_KEY 加密）。
      # EMBEDDING_LOCAL_ALLOWED_TARGETS 是 Ollama 本地 endpoint 白名单，真实生效：
      # app 容器访问宿主机 Ollama 用 host.docker.internal，不是 127.0.0.1
      # （容器内 127.0.0.1 指容器自身）；使用 Compose 网络内服务名或外部
      # Embedding Endpoint 时改为对应 host:port。
      # 生产基线：Refresh Cookie 默认 Secure（需 HTTPS / TLS 终止代理）。
      # 仅在明确搭建纯 HTTP 演练环境时才允许同时设置 REFRESH_COOKIE_SECURE=false
      # 与 REFRESH_COOKIE_ALLOW_INSECURE=true，否则应用启动即失败（绑定校验）。
      REFRESH_COOKIE_SECURE: "${REFRESH_COOKIE_SECURE:-true}"
      REFRESH_COOKIE_ALLOW_INSECURE: "${REFRESH_COOKIE_ALLOW_INSECURE:-false}"
      # 认证端点 CORS 白名单：生产必须显式设置为前端站点 Origin（逗号分隔），不能用默认值上生产。
      AUTH_ALLOWED_ORIGINS: "${AUTH_ALLOWED_ORIGINS:-http://localhost:5173}"
      # 统一可信公开地址：邀请/密码重置/邮箱验证等敏感链接的生成源（只允许 origin）。
      # 本地单机演练可留空（前端回退当前页面 Origin）；服务器部署必须配置为正式前端地址。
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-}"
      # 邮件发送（密码重置/邮箱验证）。false 时仅记录发送意图，不投递，不影响本地演练。
      MAIL_ENABLED: "${MAIL_ENABLED:-false}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_STARTTLS: "${MAIL_STARTTLS:-true}"
      MAIL_SSL: "${MAIL_SSL:-false}"
    ports:
      - "8080:8080"
    networks:
      - default
      - ai

  # W3/P1/P2 AI 能力面（Python worker），默认不随 `up -d` 启动：
  #   docker compose --profile ai-worker up -d ai-worker-api
  # 安全边界：只在 `ai`（internal: true）网络可达，不映射宿主端口；read_only + tmpfs /tmp；
  # 丢弃全部 capabilities 并禁止提权。worker 只持 ai_worker 角色的 ai_index 连接串（AI_INDEX_DATABASE_URL）、
  # Redis Stream（REDIS_URL）与 Ed25519 公钥，绝不持有 POSTGRES_* / APP_DB_PASSWORD / MinIO / JWT / 模型 API Key；
  # 模型调用凭据经 Java 内部网关（/internal/ai/credentials/lease）按次租借，外呼仅经 egress-proxy 白名单。
  ai-worker-api:
    image: ${AI_WORKER_IMAGE:-ai-collab-ai-worker:dev}
    container_name: ai-collab-ai-worker-api
    restart: unless-stopped
    profiles: ["ai-worker"]
    networks:
      ai:
        aliases:
          - ai-worker
          - ai-worker-api
    environment:
      AI_WORKER_ROLE: api
      # 只持公钥验签（kid=SPKI-DER-base64 列表）；未配置时 worker 启动即失败（fail closed）。
      AI_WORKER_ED25519_PUBLIC_KEYS: ${AI_WORKER_ED25519_PUBLIC_KEYS:-}
      # worker -> Java 内部接口（凭据租借 / 用量回报 / 任务回调；仅 ai 网络内可解析 app:8080）。
      JAVA_INTERNAL_BASE_URL: http://app:8080
      # Stream 消费（契约 §8）；主机与端口与 app 段的 Redis 一致，密码只经 env 引用。
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # P2 ai_index 数据库连接（契约 §5.2）；遵循本文件开发期允许仅起基础组件的 :- 约定，只用 ai_worker 角色。
      AI_INDEX_DATABASE_URL: postgresql://ai_worker:${AI_WORKER_DB_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-ai_collab}
      # 公网出口只有 egress-proxy（白名单 + CONNECT 443）；内部主机一律直连、不走代理。
      HTTPS_PROXY: http://egress-proxy:8888
      HTTP_PROXY: http://egress-proxy:8888
      NO_PROXY: localhost,127.0.0.1,app,ai-worker,ai-worker-api,egress-proxy,postgres,redis,minio,rocketmq-namesrv,rocketmq-broker,db-init,host.docker.internal
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  # ai-worker 唯一的公网出口（2026-11-27 决策：白名单出网代理），随 ai-worker profile 启动。
  # 只在 ai 侧地址监听、只接受 ai 子网来源、FilterDefaultDeny + 域名白名单、只放行 CONNECT 443；
  # default 网络只用于出网。白名单见 egress/allowlist，新增模型厂商时必须同步。
  egress-proxy:
    image: ${EGRESS_PROXY_IMAGE:-ai-collab-egress-proxy:tinyproxy-1.11.2-alpine3.21}
    build: ./egress
    container_name: ai-collab-egress-proxy
    restart: unless-stopped
    profiles: ["ai-worker"]
    networks:
      - ai
      - default
    volumes:
      - ./egress/allowlist:/etc/egress/allowlist:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/egress/listen && pidof tinyproxy >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # 文档链路 RocketMQ（开发基础设施，dev.ps1 start/start-dual 拉起）。端口只绑 127.0.0.1；
  # broker.dev.conf 以 host.docker.internal 注册，宿主机 Java 与容器内客户端都能直连。
  rocketmq-volume-init:
    # 一次性修正卷属主：镜像内不存在 store/logs 目录，命名卷首次创建时归 root，
    # 而 broker/namesrv 以 uid 3000 运行，不修正会写入失败并反复重启（冒烟实测）。
    # 每次 up 幂等执行；无网络、仅 chown，完成后退出。
    image: apache/rocketmq:5.3.3@sha256:455287638deddbbcd6cf48cdf988ed4d05bbac7265acc0c399d9d8228862a7d7
    container_name: ai-collab-rocketmq-volume-init
    user: "0:0"
    restart: "no"
    network_mode: none
    command: ["chown", "-R", "3000:3000", "/v/store", "/v/broker-logs", "/v/namesrv-logs"]
    volumes:
      - ai_collab_rocketmq_store:/v/store
      - ai_collab_rocketmq_broker_logs:/v/broker-logs
      - ai_collab_rocketmq_namesrv_logs:/v/namesrv-logs

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.3@sha256:455287638deddbbcd6cf48cdf988ed4d05bbac7265acc0c399d9d8228862a7d7
    container_name: ai-collab-rocketmq-namesrv
    restart: unless-stopped
    depends_on:
      rocketmq-volume-init:
        condition: service_completed_successfully
    command: ["sh", "mqnamesrv"]
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    ports:
      - "127.0.0.1:${AI_COLLAB_ROCKETMQ_NAMESRV_HOST_PORT:-9876}:9876"
    volumes:
      - ai_collab_rocketmq_namesrv_logs:/home/rocketmq/logs
    healthcheck:
      # mqadmin 失败路径也返回退出码 0，必须 grep 匹配输出做存活判定
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 | grep -q 'Cluster Name'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  rocketmq-broker:
    image: apache/rocketmq:5.3.3@sha256:455287638deddbbcd6cf48cdf988ed4d05bbac7265acc0c399d9d8228862a7d7
    container_name: ai-collab-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/conf/broker.conf"]
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 注册地址 host.docker.internal:10911，宿主机端口必须同为 10911（不可重映射）。
    ports:
      - "127.0.0.1:10911:10911"
    volumes:
      - ./rocketmq/broker.dev.conf:/home/rocketmq/conf/broker.conf:ro
      - ai_collab_rocketmq_store:/home/rocketmq/store
      - ai_collab_rocketmq_broker_logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 | grep -q broker-a"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  rocketmq-topic-init:
    # 一次性任务：预建文档注册 topic、消费组与死信 topic（autoCreateTopicEnable=false）。
    image: apache/rocketmq:5.3.3@sha256:455287638deddbbcd6cf48cdf988ed4d05bbac7265acc0c399d9d8228862a7d7
    container_name: ai-collab-rocketmq-topic-init
    restart: "on-failure:10"
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    environment:
      ROCKETMQ_DOCUMENT_TOPIC: "${ROCKETMQ_DOCUMENT_TOPIC:-document-processing}"
      ROCKETMQ_CONSUMER_GROUP: "${ROCKETMQ_CONSUMER_GROUP:-document-processing-consumer}"
    command:
      - sh
      - -c
      - |
        set -e
        sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t "$$ROCKETMQ_DOCUMENT_TOPIC"
        sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t "%DLQ%$$ROCKETMQ_CONSUMER_GROUP"
        sh mqadmin updateSubGroup -n rocketmq-namesrv:9876 -c DefaultCluster -g "$$ROCKETMQ_CONSUMER_GROUP"

networks:
  # 现有业务网络（postgres/redis/minio/app 默认加入）。
  default:
  # AI 内部网络：Docker 层面禁止访问宿主/外网；供 app、worker（ai-worker / ai-worker-api）、
  # egress-proxy 与受限数据依赖（postgres/db-init/redis）内部互通，worker 仍仅接入此网络。
  ai:
    internal: true

volumes:
  # postgres 数据卷名可经 .env 的 AI_COLLAB_PG_DATA_VOLUME 覆盖,
  # 用于延续历史数据卷(如 p2-business-e2e 验收数据集)。
  ai_collab_postgres_data:
    name: ${AI_COLLAB_PG_DATA_VOLUME:-ai_collab_postgres_data}
  ai_collab_redis_data:
  ai_collab_minio_data:
  ai_collab_rocketmq_namesrv_logs:
  ai_collab_rocketmq_broker_logs:
  ai_collab_rocketmq_store:
