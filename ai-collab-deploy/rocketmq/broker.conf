# M1 MQ 迁移：文档处理链路 RocketMQ Broker 配置（compose 三层共用）。
# 集群/主备语义保持单机最简形态；扩容与同步刷盘属于运维演进，不在本期范围。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
# 仅 compose 内网可达：broker 向 NameServer 注册该服务名地址（数据面 internal 网络，
# 不映射宿主机端口），客户端经 NameServer 拿到该地址后直连。
brokerIP1 = rocketmq-broker
listenPort = 10911
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# M1 契约：关闭自动创建 topic。业务 topic、死信 topic 与消费组由
# rocketmq-topic-init 一次性任务按环境变量显式声明（见 compose 文件）。
autoCreateTopicEnable = false
# 演示/中等规模的存储保留策略（72 小时，每天 04 点清理）
fileReservedTime = 72
deleteWhen = 04
