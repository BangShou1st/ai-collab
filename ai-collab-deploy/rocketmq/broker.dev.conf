# 开发用 Broker 配置（仅 docker-compose.yml 使用；staging/prod/local 拓扑使用 broker.conf）。
# 开发态 Java 进程跑在宿主机：broker 必须向 NameServer 注册宿主机与容器都可解析的地址。
# host.docker.internal 在 Docker Desktop 宿主机 hosts 与容器内均可解析（Linux 由 compose
# 的 extra_hosts host-gateway 补齐）；listenPort 必须与宿主机映射端口一致，不可重映射。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = host.docker.internal
listenPort = 10911
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 与其他环境一致：关闭自动创建 topic，由 rocketmq-topic-init 显式声明。
autoCreateTopicEnable = false
fileReservedTime = 24
deleteWhen = 04
