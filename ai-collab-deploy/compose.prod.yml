# 独立生产拓扑；不要与开发 compose 叠加。上线前必须运行 prod-config-check.mjs。
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    # shell 使用容器环境变量，避免把密码作为 compose command 参数持久化。
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    logging: *logging

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [data]
    logging: *logging

  app:
    image: ${APP_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?required}
      MINIO_BUCKET: ${MINIO_BUCKET:?required}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?required}
      MINIO_REQUIRE_PUBLIC_ENDPOINT: "true"
      MINIO_MANAGE_BUCKET: "false"
      FEISHU_OAUTH_REDIRECT_URI: "${FEISHU_OAUTH_REDIRECT_URI:-}"
      CONNECTOR_CLEANUP_ENABLED: "${CONNECTOR_CLEANUP_ENABLED:-true}"
      JWT_SECRET: ${JWT_SECRET:?required}
      MODEL_CONFIG_MASTER_KEY: ${MODEL_CONFIG_MASTER_KEY:?required}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?required}
      # 默认开放公开注册；运维可在受控环境文件中临时关闭。
      AUTH_PUBLIC_REGISTRATION_ENABLED: "${AUTH_PUBLIC_REGISTRATION_ENABLED:-true}"
      REFRESH_COOKIE_SECURE: "true"
      REFRESH_COOKIE_ALLOW_INSECURE: "false"
      CHAT_ENABLED: "false"
      AGENT_ENABLED: "${AGENT_ENABLED:-false}"
      AGENT_MCP_ALLOWED_HOSTS: "${AGENT_MCP_ALLOWED_HOSTS:-}"
    networks:
      edge:
        aliases: [app-edge]
      data: {}
    logging: *logging

  proxy:
    image: ${PROXY_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      app: {condition: service_started}
    ports:
      - "${PUBLIC_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ../ai-collab-frontend/dist:/usr/share/nginx/html:ro
      - ${TLS_CERT_FILE:?required}:/etc/nginx/tls/cert.pem:ro
      - ${TLS_KEY_FILE:?required}:/etc/nginx/tls/key.pem:ro
    networks:
      edge:
        ipv4_address: 172.30.173.2
      data: {}
    logging: *logging

networks:
  # 固定代理地址仅作信任锚点；若网段冲突，必须同步调整后端配置并重跑安全测试。
  edge:
    ipam:
      config:
        - subnet: 172.30.173.0/24
          # 动态容器地址从高半段分配，避免抢占受信代理 .2。
          ip_range: 172.30.173.128/25
          gateway: 172.30.173.1
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
