# 本地一键部署拓扑（Windows 11 / Linux / macOS + Docker）。
# 与 compose.prod.yml 共用同一批应用镜像，差异仅在：
#   - 入口只绑定 127.0.0.1（HTTP，不对外暴露）；数据面容器完全不发布端口；
#   - Refresh Cookie 走显式的本地 HTTP 例外（两项必须同时为真，后端有启动守卫）；
#   - 数据库/Redis/MinIO 使用独立卷与独立网段，不与开发（ai-collab-deploy）和生产拓扑冲突。
# 首次安装请使用 install.ps1 / install.sh，不要手工编辑本文件。
name: ai-collab-local

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    # shell 使用容器环境变量，避免把密码作为 compose command 参数持久化。
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
    logging: *logging

  minio:
    # 与 compose.prod.yml 完全相同的 digest 固定；更新方式见 docs/deployment-recovery.md。
    image: cgr.dev/chainguard/minio:latest@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [data]
    logging: *logging

  db-init:
    # 一次性幂等任务：已有数据卷时 docker-entrypoint-initdb.d 不会重跑，
    # 因此每次 up 都执行 postgres/db-init.sql（扩展、ai_collab_app / ai_worker 角色、ai_index/ai_runtime schema 与隔离权限）。
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?required}
      PGUSER: ${POSTGRES_USER:?required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?required}
      AI_WORKER_DB_PASSWORD: ${AI_WORKER_DB_PASSWORD:?required}
    volumes:
      - ./postgres/db-init.sql:/db-init/db-init.sql:ro
    command:
      - sh
      - -c
      - exec psql -v ON_ERROR_STOP=1 -f /db-init/db-init.sql
    networks: [data]
    logging: *logging

  mailpit:
    # 本地/演练专用 SMTP 假服务器（可选 profile）：配合 local.env 的 MAIL_ENABLED=true /
    # MAIL_HOST=mailpit / MAIL_PORT=1025 使用。收件箱 UI 仅绑定 127.0.0.1。
    profiles: ["maildev"]
    image: axllent/mailpit:latest
    container_name: ai-collab-local-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [edge]
    logging: *logging

  rocketmq-volume-init:
    # 一次性修正卷属主：镜像内不存在 store/logs 目录，命名卷首次创建时归 root，
    # 而 broker/namesrv 以 uid 3000 运行，不修正会写入失败并反复重启（冒烟实测）。
    # 每次 up 幂等执行；无网络、仅 chown，完成后退出。
    image: apache/rocketmq:5.3.3@sha256:455287638deddbbcd6cf48cdf988ed4d05bbac7265acc0c399d9d8228862a7d7
    user: "0:0"
    restart: "no"
    network_mode: none
    logging: *logging
    command: ["chown", "-R", "3000:3000", "/v/store", "/v/broker-logs", "/v/namesrv-logs"]
    volumes:
      - rocketmq_store:/v/store
      - rocketmq_broker_logs:/v/broker-logs
      - rocketmq_namesrv_logs:/v/namesrv-logs

  rocketmq-namesrv:
    # 文档处理链路 RocketMQ NameServer（常驻）。
    # 数据面仅 internal 网络，不映射宿主机管理端口（契约脚本断言）。
    image: apache/rocketmq:5.3.3@sha256:455287638deddbbcd6cf48cdf988ed4d05bbac7265acc0c399d9d8228862a7d7
    restart: unless-stopped
    depends_on:
      rocketmq-volume-init: {condition: service_completed_successfully}
    command: ["sh", "mqnamesrv"]
    environment:
      # mqnamesrv/mqbroker 脚本读取 JAVA_OPT_EXT 追加 JVM 参数；按容器资源收敛堆大小
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    volumes:
      - rocketmq_namesrv_logs:/home/rocketmq/logs
    healthcheck:
      # mqadmin 失败路径也返回退出码 0（已实测），必须 grep 匹配输出做存活判定
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 | grep -q 'Cluster Name'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [data]
    logging: *logging

  rocketmq-broker:
    # 文档处理链路 Broker（常驻）。broker.conf 挂载自版本库（brokerIP1=服务名、
    # 关闭自动建 topic）；store 目录持久化到独立卷。
    image: apache/rocketmq:5.3.3@sha256:455287638deddbbcd6cf48cdf988ed4d05bbac7265acc0c399d9d8228862a7d7
    restart: unless-stopped
    depends_on:
      rocketmq-namesrv: {condition: service_healthy}
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/conf/broker.conf"]
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq_store:/home/rocketmq/store
      - rocketmq_broker_logs:/home/rocketmq/logs
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
    healthcheck:
      # broker 存活判定 = 已在 NameServer 注册且可见（同集群名单内）
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 | grep -q broker-a"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [data]
    logging: *logging

  rocketmq-topic-init:
    # autoCreateTopicEnable=false（topic 显式声明契约）：一次性任务预建文档注册 topic、
    # 其消费组与死信 topic（死信同样必须预建，否则重试耗尽的消息会因无路由丢失）。
    image: apache/rocketmq:5.3.3@sha256:455287638deddbbcd6cf48cdf988ed4d05bbac7265acc0c399d9d8228862a7d7
    restart: "on-failure:10"
    depends_on:
      rocketmq-broker: {condition: service_healthy}
    environment:
      ROCKETMQ_DOCUMENT_TOPIC: "${ROCKETMQ_DOCUMENT_TOPIC:-document-processing}"
      ROCKETMQ_CONSUMER_GROUP: "${ROCKETMQ_CONSUMER_GROUP:-document-processing-consumer}"
    command:
      - sh
      - -c
      - |
        set -e
        sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t "$$ROCKETMQ_DOCUMENT_TOPIC"
        sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c DefaultCluster -t "%DLQ%$$ROCKETMQ_CONSUMER_GROUP"
        sh mqadmin updateSubGroup -n rocketmq-namesrv:9876 -c DefaultCluster -g "$$ROCKETMQ_CONSUMER_GROUP"
    networks: [data]
    logging: *logging

  app:
    image: ${APP_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      db-init: {condition: service_completed_successfully}
      rocketmq-broker: {condition: service_healthy}
      rocketmq-topic-init: {condition: service_completed_successfully}
    healthcheck:
      # O1：健康探针走独立管理端口 8081（仅 compose 内网，不映射宿主机、不经 nginx）。
      test: ["CMD-SHELL", "wget -T 5 -qO- http://127.0.0.1:8081/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?required}
      # C0.1：应用只用非超级业务角色 ai_collab_app（db-init 创建并授予 public 所有权）；
      # 超级用户 POSTGRES_USER 只给 db-init 与备份。
      SPRING_DATASOURCE_USERNAME: ai_collab_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
      MINIO_BUCKET: ${MINIO_BUCKET:?required}
      # 本地下载走同源代理路径：预签名 URL 指向本机入口，由 web 服务的 /storage 转发。
      # 空值会导致下载地址指向容器内地址（浏览器不可达），必须配置。
      MINIO_PUBLIC_ENDPOINT: http://localhost:${HTTP_PORT:?required}
      MINIO_MANAGE_BUCKET: "true"
      JWT_SECRET: ${JWT_SECRET:?required}
      MODEL_CONFIG_MASTER_KEY: ${MODEL_CONFIG_MASTER_KEY:?required}
      AUTH_ALLOWED_ORIGINS: http://localhost:${HTTP_PORT:?required}
      AUTH_PUBLIC_REGISTRATION_ENABLED: "${AUTH_PUBLIC_REGISTRATION_ENABLED:-true}"
      # 本地 HTTP Cookie 例外：两项必须同时设置，否则后端启动即失败（安全守卫）。
      # 该例外只存在于 compose.local.yml；compose.prod.yml 固定 Secure=true。
      REFRESH_COOKIE_SECURE: "false"
      REFRESH_COOKIE_ALLOW_INSECURE: "true"
      APP_PUBLIC_URL: http://localhost:${HTTP_PORT:?required}
      AGENT_RUNTIME_ALLOWED: "${AGENT_RUNTIME_ALLOWED:-true}"
      CHAT_ENABLED: "${CHAT_ENABLED:-false}"
      AGENT_ENABLED: "${AGENT_ENABLED:-false}"
      AGENT_MCP_ALLOWED_HOSTS: "${AGENT_MCP_ALLOWED_HOSTS:-}"
      # 内部 AI 令牌只有 Ed25519 一种：app 持私钥签发，ai-worker 只持公钥验签。
      INTERNAL_AI_ED25519_PRIVATE_KEY: "${INTERNAL_AI_ED25519_PRIVATE_KEY:?required}"
      INTERNAL_AI_ED25519_PUBLIC_KEYS: "${INTERNAL_AI_ED25519_PUBLIC_KEYS:-}"
      INTERNAL_AI_ED25519_KID: "${INTERNAL_AI_ED25519_KID:-k1}"
      # /internal/storage-authorize 仅信任固定受信代理地址；本地拓扑给 web 固定
      # 172.30.174.2（见下方 edge ipam），与生产 172.30.173.2 的设计同构。
      STORAGE_MINIO_TRUSTEDPROXYADDRESS: 172.30.174.2
      # 本地 Ollama 白名单：容器内访问宿主机 Ollama 用 host.docker.internal。
      EMBEDDING_LOCAL_ALLOWED_TARGETS: ${EMBEDDING_LOCAL_ALLOWED_TARGETS:-host.docker.internal:11434}
      MAIL_ENABLED: "${MAIL_ENABLED:-false}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-AI Collab <no-reply@localhost>}"
      MAIL_STARTTLS: "${MAIL_STARTTLS:-true}"
      MAIL_SSL: "${MAIL_SSL:-false}"
      # 可观测性 O1/O2：管理端口暴露白名单（8081 仅 compose 内网，不映射宿主机）；
      # OTLP gRPC 导出指向 compose 内 Tempo。
      MANAGEMENT_ENDPOINTS_EXPOSURE: "health,info,prometheus"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
      # 文档链路固定走 RocketMQ。false 仅用于运维紧急关闭：文档注册返回 503，不回落进程内执行。
      MQ_ENABLED: "${MQ_ENABLED:-true}"
      ROCKETMQ_NAMESRV_ADDR: "rocketmq-namesrv:9876"
      ROCKETMQ_DOCUMENT_TOPIC: "${ROCKETMQ_DOCUMENT_TOPIC:-document-processing}"
      ROCKETMQ_CONSUMER_GROUP: "${ROCKETMQ_CONSUMER_GROUP:-document-processing-consumer}"
    networks:
      edge:
        aliases: [app-edge]
      data: {}
    logging: *logging

  prometheus:
    # O1 指标抓取：抓 app:8081/actuator/prometheus，仅 data 内网。
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -T 5 -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [data]
    logging: *logging

  tempo:
    # O2 trace 后端：接收 app 的 OTLP gRPC 导出，供 Grafana 查询。
    image: grafana/tempo:2.7.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    user: root
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -T 5 -q --spider http://127.0.0.1:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [data]
    logging: *logging

  grafana:
    # O1/O2 面板（仅 local/staging）：数据源与最小面板经 provisioning 自动装载。
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    depends_on:
      prometheus: {condition: service_started}
      tempo: {condition: service_started}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      # 面板 UI 仅绑本机回环；指标/trace 数据面（8081/9090/3200/4317）一律不发布。
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -T 5 -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [data]
    logging: *logging

  web:
    image: ${WEB_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      app: {condition: service_started}
    ports:
      # 仅监听本机回环地址，避免把服务暴露到局域网/公网。
      - "127.0.0.1:${HTTP_PORT:?required}:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      edge:
        ipv4_address: 172.30.174.2
      data: {}
    logging: *logging

networks:
  # 独立网段：与 compose.prod.yml / compose.staging.yml 的 172.30.173.0/24 不重叠，
  # 允许同一台机器上共存开发 Staging 拓扑与本地一键部署。
  # web 固定 .2 作为后端受信代理锚点；动态地址从高半段分配。
  edge:
    ipam:
      config:
        - subnet: 172.30.174.0/24
          ip_range: 172.30.174.128/25
          gateway: 172.30.174.1
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  tempo_data:
  grafana_data:
  rocketmq_namesrv_logs:
  rocketmq_broker_logs:
  rocketmq_store:
